<script>
'use strict';
// ============================================================================
// BLUECOW RAGER - an endless side-on mountain bike descent on the LittleJS 3D plugin
// tap to jump, hold in the air to backflip, a second finger front flips and throws style tricks
// ============================================================================
(()=>{
const {abs, min, max, sin, cos, tan, atan, atan2, sqrt, floor, ceil, round, hypot, acos, asin, exp, sign, PI} = Math;
const TAU = PI*2;
const clamp01 = v=> v < 0 ? 0 : v > 1 ? 1 : v;
const clampV = (v, a, b)=> v < a ? a : v > b ? b : v;
const mix = (a, b, t)=> a + (b - a)*t;
const sstep = t=> (t = clamp01(t), t*t*(3 - 2*t));
const wrapPI = a=> a - TAU*floor((a + PI)/TAU);
const damp = (rate, dt)=> 1 - exp(-rate*dt);

// ---------- engine settings, set before engineInit
setCanvasPixelRatio(min(window.devicePixelRatio || 1, 1.6));
setTouchPinchWheel(false);
setSoundIgnoreSilentSwitch(true);
setSoundVolume(.5);
setCanvasClearColor(hsl(.6,.3,.2));
// the game steps once each frame the screen draws, by however long the frame took, so it moves evenly on a 90 or
// 120 Hz screen too rather than in a fixed 60 a second
setEngineVariableStep(true);

// ---------- seeded random and noise
function mulberry(seed)
{
    return ()=>
    {
        seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}
function makeNoise(rnd)
{
    const p = new Uint8Array(512), q = [];
    for (let i = 0; i < 256; ++i) q.push(i);
    for (let i = 255; i > 0; --i) { const j = rnd()*(i + 1) | 0; [q[i], q[j]] = [q[j], q[i]]; }
    for (let i = 0; i < 512; ++i) p[i] = q[i & 255];
    const gx = new Float32Array(256), gy = new Float32Array(256);
    for (let i = 0; i < 256; ++i) { const a = rnd()*TAU; gx[i] = cos(a); gy[i] = sin(a); }
    return (x, y)=>
    {
        const X = floor(x), Y = floor(y), xf = x - X, yf = y - Y, i = X & 255, j = Y & 255;
        const h00 = p[p[i] + j], h10 = p[p[i+1] + j], h01 = p[p[i] + j + 1], h11 = p[p[i+1] + j + 1];
        const n00 = gx[h00]*xf + gy[h00]*yf, n10 = gx[h10]*(xf - 1) + gy[h10]*yf;
        const n01 = gx[h01]*xf + gy[h01]*(yf - 1), n11 = gx[h11]*(xf - 1) + gy[h11]*(yf - 1);
        const u = xf*xf*xf*(xf*(xf*6 - 15) + 10), v = yf*yf*yf*(yf*(yf*6 - 15) + 10);
        return (n00 + (n10 - n00)*u + (n01 - n00 + (n11 - n10 - n01 + n00)*u)*v)*1.4;
    };
}
function fbm(n, x, y, octaves)
{
    let sum = 0, amp = 1, norm = 0;
    for (let o = 0; o < octaves; ++o, x *= 2.03, y *= 2.03, amp *= .5)
        sum += n(x, y)*amp, norm += amp;
    return sum/norm;
}
function ridged(n, x, y, octaves)
{
    let sum = 0, amp = 1, norm = 0, weight = 1;
    for (let o = 0; o < octaves; ++o, x *= 2.1, y *= 2.1, amp *= .5)
    {
        let r = 1 - abs(n(x, y));
        r *= r*weight;
        weight = clamp01(r*1.6);
        sum += r*amp, norm += amp;
    }
    return sum/norm;
}

// ============================================================================
// TRACK - an endless seeded descent from a summit, generated a section at a time
// ahead of the rider: runs with rollers, kickers, cliffs, gaps, rock gardens and
// grind rails, with orbs to collect and a marker every 500 m
// ============================================================================
const DX = .5, GRADE_AVG = .3, G_RIDE = 9.81*1.05, G_AIR = 13.5, POP = 8, VMIN = 9.5, VMAX = 22;
const S_DIRT = 0, S_GRASS = 1, S_ROCK = 2, S_SNOW = 3, S_WOOD = 4;
const BIOMES = ['snow', 'alpine', 'forest', 'autumn', 'desert'];
const BIOME_NAMES = {snow: 'SNOWFIELDS', alpine: 'ALPINE MEADOWS', forest: 'PINE FOREST', autumn: 'AUTUMN WOODS', desert: 'RED ROCK CANYON'};
const START_X = 46;
let ORB_V = 13;   // the launch speed air orbs are laid out for, measured from real rides

let seed = 1, rnd, NA, NB, NC, NV;
let ys = [], gapF = [], rails = [], rocks = [], orbs = [], signs = [], feats = [], gaps = [], pendingArcs = [];
let genBase = 0, genGrade = 0, nextSignX = 500, lastLaunch = null, nextBooterX = 200, nextCanyonX = 900, nextMegaX = 380, nextTyreX = 140;
// line blocks: the trail splits into lines across the face of the mountain, reached by berms, each with its own
// features, and they all come back together. PRO is up on the ridge, HIGH along the hillside behind the trail,
// LOW down the slope in front; the main trail carries on between them.
const T_MAX = 30;
const LINES = {
    pro:  {lane: 2, z: -20, T: 30, dir: 1, name: 'PRO LINE', short: 'PRO', pts: 600, color: 'rgba(255,120,95,.95)', sign: hsl(.02,.85,.55)},
    high: {lane: 1, z: -10, T: 22, dir: 1, name: 'HIGH LINE', short: 'HIGH', pts: 300, color: 'rgba(255,214,70,.95)', sign: hsl(.14,.95,.55)},
    low:  {lane: -1, z: 9, T: 22, dir: -1, name: 'LOW LINE', short: 'LOW', pts: 300, color: 'rgba(90,230,215,.95)', sign: hsl(.5,.9,.5)}};
// the lanes from the top of the hill down, the main trail as 0
const LANES = [2, 1, 0, -1];
const offeredLanes = s=> LANES.filter(l=> l == 0 || s.lines[l]);
let splits = [], openSplit = null, lastSplitEnd = 0, nextSplitGap = 0, ride = null, noSign = [], paces = [], nextDropX = 450;
// ravines the trail bridges, creeks it splashes through, rock arches over it
let gullies = [], arches = [];

// ---------- the weave: the trail swings across the face of the mountain, so the world is bent around it.
// The game runs along x; z is across the trail. Drawing moves everything sideways by the weave, fully near
// the trail and less and less out over the hillside and the valley, so the ground never folds over itself.
let NW, bends = [];
function weaveZ(x)
{
    let z = MT.weave*(22*NW(x*.006, 1.7) + 7*NW(x*.018, 4.1))*sstep((x - 70)/150);
    // a bend swings the trail out and back round, straight again at its end; a run of turns snakes left and right
    for (const b of bends) if (x > b.x0 && x < b.x1)
        z += b.lam ? b.A*sin(TAU*(x - b.x0)/b.lam)*sstep((x - b.x0)/(b.lam*.4))*sstep((b.x1 - x)/(b.lam*.4)) : b.A*sin(PI*(x - b.x0)/(b.x1 - b.x0))**2;
    return z;
}
const weaveK = zr=> zr >= 0 ? 1/(1 + max(0, zr - 6)/25) : 1/(1 + max(0, -zr - 14)/40);
const wz = (x, zr=0)=> zr + weaveZ(x)*weaveK(zr);
// how fast the line goes across as it goes along, and how fast that turns
const wzD = (x, zr=0)=> (weaveZ(x + .5) - weaveZ(x - .5))*weaveK(zr);
const wzK = x=> weaveZ(x + 1) - 2*weaveZ(x) + weaveZ(x - 1);

const genX = ()=> (ys.length - 1)*DX;
const bumpAt = x=> .05*NV(x*.37, 3.1) + .025*NV(x*1.3, 7.7);
const trendY = x=> -GRADE_AVG*x;
const pushY = (y, gap=0)=> { ys.push(y); gapF.push(gap); };

// ---------- queries
function groundY(x)
{
    const u = clampV(x/DX, 0, ys.length - 1.001), i = floor(u), f = u - i;
    return ys[i] + (ys[i + 1] - ys[i])*f;
}
function groundSlope(x)
{
    const i = clampV(floor(x/DX), 0, ys.length - 2);
    return (ys[i + 1] - ys[i])/DX;
}
const gapAt = x=> gapF[clampV(round(x/DX), 0, gapF.length - 1)];
// the ground with gaps bridged and features smoothed away, for the hillside behind the trail
function smoothY(x)
{
    let s = 0, w = 0;
    for (let k = -6; k <= 6; ++k)
    {
        const i = clampV(round((x + k*2)/DX), 0, ys.length - 1);
        if (gapF[i]) continue;
        const wt = 1 - abs(k)/7;
        s += ys[i]*wt; w += wt;
    }
    return w ? s/w : groundY(x);
}
const railY = (r, x)=> r.y0 + (x - r.x0)*r.slope;

// ---------- the line the rider is on: the main trail, or a branch between its split and its merge
function brT(b, x)
{
    if (x <= b.x0 || x >= b.x1) return 0;
    return x < b.x0 + b.T ? sstep((x - b.x0)/b.T) : x > b.x1 - b.T ? sstep((b.x1 - x)/b.T) : 1;
}
const brZ = (b, x)=> b.z*brT(b, x);
function brY(b, x)
{
    const u = clampV((x - b.x0)/DX, 0, b.ys.length - 1.001), i = floor(u), f = u - i;
    return b.ys[i] + (b.ys[i + 1] - b.ys[i])*f;
}
const onBranch = x=> !!ride && x > ride.x0 && x < ride.x1;
// the line under the rider at x: the one being ridden, or the main trail as null
const lineOf = x=> onBranch(x) ? ride : null;
const onLine = (f, x)=> (f.line || null) == lineOf(x);
const rideY = x=> onBranch(x) ? brY(ride, x) : groundY(x);
function rideSlope(x)
{
    if (!onBranch(x)) return groundSlope(x);
    const i = clampV(floor((x - ride.x0)/DX), 0, ride.ys.length - 2);
    return (ride.ys[i + 1] - ride.ys[i])/DX;
}
const rideGap = x=> onBranch(x) ? brGap(ride, x) : gapAt(x);
// the ground the camera frames: across a chasm, the straight line from its lip to its far edge rather than the
// bottom of it far below, so a jump over one is framed as a jump and the view does not dive into the pit
function camGround(x)
{
    if (!rideGap(x)) return rideY(x);
    let a = x, b = x;
    for (let k = 0; k < 120 && rideGap(a); ++k) a -= DX;
    for (let k = 0; k < 120 && rideGap(b); ++k) b += DX;
    return mix(rideY(a), rideY(b), (x - a)/max(DX, b - a));
}
// the main trail heavily smoothed, chasms bridged, for a branch to follow at a distance
function wideY(x)
{
    let s = 0, w = 0;
    for (let k = -8; k <= 8; ++k)
    {
        const i = clampV(round((x + k*1.5)/DX), 0, ys.length - 1);
        if (gapF[i]) continue;
        const wt = 1 - abs(k)/9;
        s += ys[i]*wt; w += wt;

// biomes in zones down the mountain, a random order and length each run, blended over 160 m at each change.
// Each lasts a minute or two of riding; the snowfields never come before about a minute and a half of it.
const SNOW_FROM = 2080;
let zoneB = [0], zoneSeq = ['snow'], MT = {};
function biomeInit(s)
{
    // its own random stream, so the trail itself is the same for a seed whatever the scenery does
    const r = mulberry(s*104729 + 77);
    zoneSeq = []; zoneB = [0];
    let prev = -1;
    for (let k = 0; k < 400; ++k)
    {
        let b;
        do b = r()*BIOMES.length | 0; while (b == prev || BIOMES[b] == 'snow' && zoneB[k] < SNOW_FROM);
        zoneSeq.push(BIOMES[b]); prev = b;
        zoneB.push(zoneB[k] + (k ? 1500 + r()*1100 : 1000 + r()*500));
    }
    // the look of the mountains this run
    MT = {
        sharp: r(),                          // 0 rolling domes .. 1 jagged spires
        farAmp: .55 + r()*1.05, farFreq: .55 + r()*1.2,
        midAmp: 55 + r()*70, midFreq: .0022 + r()*.005, midBase: -88 + r()*30,
        hillAmp: 1.5 + r()*6,                // how lumpy the hillside behind the trail is
        snow: r() < .22 ? 9 : -.18 + r()*.4, // snowline shift; some runs no snow on the peaks at all
        rockPal: r()*5 | 0,
        rockShift: r()*.1 - .05,
        weave: .75 + r()*.5,
    };
    NW = makeNoise(mulberry(s*31337 + 5));
}
function zoneAt(x)
{
    if (x < zoneB[1]) return 0;
    let lo = 1, hi = zoneB.length - 2;
    while (lo < hi) { const m = lo + hi + 1 >> 1; if (zoneB[m] <= x) lo = m; else hi = m - 1; }
    return lo;
}
const zoneStart = k=> k <= 0 ? 0 : zoneB[min(k, zoneB.length - 1)];
const biomeOf = k=> zoneSeq[clampV(k, 0, zoneSeq.length - 1)];
function biomeW(x, out={})
{
    out.snow = out.alpine = out.forest = out.autumn = out.desert = 0;
    const k = zoneAt(x), s0 = zoneStart(k), s1 = zoneStart(k + 1);
    if (k > 0 && x < s0 + 80)
    {
        const t = sstep((x - (s0 - 80))/160);
        out[biomeOf(k - 1)] += 1 - t; out[biomeOf(k)] += t;
    }
    else if (x > s1 - 80)
    {
        const t = sstep((x - (s1 - 80))/160);
        out[biomeOf(k)] += 1 - t; out[biomeOf(k + 1)] += t;
    }
    else out[biomeOf(k)] = 1;
    return out;
}
const BW = {};
const surfaceAt = x=> biomeW(x, BW).snow > .5 ? S_SNOW : S_DIRT;

// ---------- building blocks
function addRun(len, gradeTo, rollA=0, rollL=20)
{
    const n = max(1, round(len/DX)), g0 = genGrade, ph = rnd()*TAU;
    for (let k = 1; k <= n; ++k)
    {
        const u = k/n, x = genX() + DX;
        genGrade = mix(g0, gradeTo, sstep(min(1, u*2.5)));
        genBase -= genGrade*DX;
        const roll = rollA*sin(ph + x*TAU/rollL)*sstep(u*5)*sstep((1 - u)*5);
        pushY(genBase + roll + bumpAt(x));
    }
}

// steeper and mellower stretches, steered back toward the mountain's average fall
function gradeTarget(d)
{
    const pull = (genBase - trendY(genX()))*.006;
    return clampV(mix(.16, .44 + d*.08, rnd()) + pull, .12, .62);
}

// a ramp that curves up out of the slope and ends in a sheer lip
function addKicker(H, Lr, type='kicker')
{
    const n = round(Lr/DX), x0 = genX();
    for (let k = 1; k <= n; ++k)
    {
        const x = genX() + DX, u = k/n;
        genBase -= genGrade*DX;
        pushY(genBase + bumpAt(x) + H*u*u);
    }
    const i = ys.length - 1;
    const f = {type, x0, x1: genX(), H, lipY: ys[i], lipSlope: (ys[i] - ys[i - 1])/DX};
    feats.push(f);
    return f;
}

// a big kicker onto a long steep landing that falls away under the flight: the most air on the mountain.
// The landing is laid out for a fast rider rolling off the lip, so anyone from a cruise to flat out comes down on its slope.
function addBooter(d) { return addJump(2.2 + rnd()*.6 + d*.4, 7 + rnd()*1.5, .55 + rnd()*.12 + d*.08, 'booter', 17); }
// the mega booter at the end of a set of battery cells: supercharged, the rider leaves its lip at SEND_V, and its
// landing runs on far enough down the mountain for that flight; a rider who missed a cell lands high on the same slope
function addMegaBooter(d)
{
    const f = addJump(2.4 + rnd()*.4, 7.5 + rnd(), .55, 'booter', SEND_V, .5, SEND_V + 1, 30);
    f.mega = true; f.sendV = SEND_V;
    return f;
}
// a kicker with its own landing, steeper than the trail, laid along the flight off it
function addJump(H, L, G, type='kicker', orbV=ORB_V, knuckle=.5, v=VMAX + 2, spare=12)
{
    const f = addKicker(H, L, type), a = atan(f.lipSlope);
    // a knuckle off the lip, a short one or a whole step down, then the landing all the way past that flight
    let x = 0, y = 0, vx = v*cos(a), vy = v*sin(a);
    for (let t = 0; t < 6 && y > -knuckle - G*x; t += 1/60) { x += vx/60; vy -= G_AIR/60; y += vy/60; }
    genBase = f.lipY - knuckle; genGrade = G; f.drop = knuckle;
    addRun(x + spare, G, 0);
    f.x2 = genX(); f.orbV = orbV;
    addRun(16, gradeTarget(clamp01(genX()/6000)), 0);
    return f;
}

// a drop-in, Rampage style: the trail swings round a bend onto a flat ledge where the rider checks their speed,
// then rolls off a sheer face, or pops off it with a tap at the lip, onto a long steep landing far below
function addDropIn(d)
{
    addRun(12, min(genGrade, .3), 0);
    const x0 = genX();
    addRun(34, .05, 0);
    const lipX = genX(), lipY = ys[ys.length - 1], F = 10 + rnd()*6 + d*8, G = 1 + rnd()*.15, v = 7 + rnd();
    // the landing reaches past a rider who came off the lip a little fast and popped as well
    let x = 0, y = 0, vx = v + 2, vy = POP;
    for (let t = 0; t < 6 && y > -F - G*x; t += 1/60) { x += vx/60; vy -= G_AIR/60; y += vy/60; }
    genBase = lipY - F; genGrade = G;
    addRun(x + 14, G, 0);
    const f = {type: 'dropin', x0, x1: lipX, x2: genX(), lipY, lipSlope: -.05, F, v, landX: lipX + x, orbV: v};
    feats.push(f);
    paces.push({x0: x0 + 2, x1: lipX + .5, v, f});
    bends.push({x0: x0 - 40, x1: lipX - 3, A: (rnd() < .5 ? -1 : 1)*(7 + rnd()*4)});
    addRun(24, gradeTarget(d), 0);
    return f;
}
// berm turns: the trail snakes left and right across the mountain, each turn banked up on its outside
function addBermTurns(d)
{
    const n = 3 + (rnd() < .5 ? 1 : 0), lam = 62 + rnd()*16, x0 = genX() + 6, A = (rnd() < .5 ? -1 : 1)*(6.5 + rnd()*2 + d*1.5);
    // n turns, half a wave each, with a little straight run in and out
    const x1 = x0 + lam*(n + 1)/2;
    bends.push({x0, x1, A, lam});
    const f = {type: 'berms', x0, x1, apexes: [], carved: 0};
    for (let k = 0; k < n; ++k) f.apexes.push(x0 + lam*(k + 1)/2);
    feats.push(f);
    addRun(x1 - genX() + 4, gradeTarget(d), 0);
    return f;
}

// a step-down: a small kicker off a ledge onto a landing a few metres lower, no chasm between
const addStepDown = d=> addJump(1 + rnd()*.4, 4.5 + rnd(), .5 + rnd()*.1, 'stepdown', 14, 3 + rnd()*3 + d*2);

// drop stairs: three or four ledges stepping down the mountain, ridden at a steady pace, a little drop off each
function addStairs(d)
{
    const n = 3 + (rnd() < .4 + d*.4 ? 1 : 0), v = 11 + rnd()*2, x0 = genX();
    addRun(16, .12, 0);
    const f = {type: 'stairs', x0, n, lips: [], airs: 0};
    for (let k = 0; k < n; ++k)
    {
        if (k) addRun(7.5 + rnd()*2, .1, 0);
        f.lips.push(genX());
        // the face: the next point of ground is this much lower
        genBase -= 1.5 + rnd()*1.2 + d*.6;
    }
    // a steep landing off the last one
    genGrade = .5;
    addRun(16, .5, 0);
    f.x1 = genX();
    feats.push(f);
    paces.push({x0: x0 + 2, x1: f.lips[n - 1] + .5, v, f});
    const last = f.lips[n - 1];
    lastLaunch = {x1: last, lipY: groundY(last - .01), lipSlope: -.1};
    addRun(14, gradeTarget(d), 0);
    return f;
}

// a canyon gap: the trail sets the rider's speed on the run in, then a big kicker throws them across a wide chasm.
// It is as wide as a rider at that speed, rolling off without a pop, clears with room to spare.
function addCanyon(d)
{
    const v = 15 + rnd()*3;
    addRun(10, min(genGrade, .3), 0);
    const z0 = genX();
    addRun(26, .2, 0);
    const f = addKicker(1.9 + rnd()*.4, 6, 'canyon');
    paces.push({x0: z0, x1: f.x1 + .2, v, hold: true, f});
    const drop = 3 + rnd()*3, G = .55, a = atan(f.lipSlope), vx = v*cos(a), vy = v*sin(a);
    const clears = W=> { const t = (W + 3)/vx; return vy*t - .5*G_AIR*t*t > -drop - 3*G + .8; };
    let W = 26;
    while (W > 10 && !clears(W)) W -= .5;
    const n = round(W/DX), floorY = f.lipY - drop - 45;
    for (let k = 1; k <= n; ++k) pushY(floorY, 1);
    f.W = n*DX; f.x2 = genX() + DX*.5; f.drop = drop; f.landY = f.lipY - drop; f.camX0 = z0 + 6; f.orbV = v; f.camDist = 26;
    gaps.push(f);
    // the landing reaches past a rider who popped at the lip
    let x = 0, y = 0, wx = vx, wy = vy + POP;
    for (let t = 0; t < 6 && y > -drop - G*max(0, x - f.W); t += 1/60) { x += wx/60; wy -= G_AIR/60; y += wy/60; }
    genBase = f.landY; genGrade = G;
    addRun(max(12, x - f.W + 12), G, 0);
    f.landX = f.x1 + x;
    addRun(16, gradeTarget(d), 0);
    return f;
}

// a wooden drop deck, North Shore style: a plank runway out over the slope as the mountain falls away beneath it,
// ending in a drop off its end onto the slope below
function addDeck(d)
{
    // held at one grade on the way in, so no crest throws the bike under the deck
    addRun(20, genGrade, 0);
    const len = 16 + rnd()*10, x0 = genX() + 1.5, G = .55 + rnd()*.1 + d*.05;
    addRun(len + 1.5, G, 0);
    const r = {x0, x1: x0 + len, y0: groundY(x0) + .15, slope: -.06, deck: true, mount: true};
    r.y1 = railY(r, r.x1);
    const h = r.y1 - groundY(r.x1);
    // the landing, far enough down the slope for a fast rider off the end
    let x = 0, y = 0, vx = VMAX + 2, vy = 0;
    for (let t = 0; t < 6 && y > -h - G*x; t += 1/60) { x += vx/60; vy -= G_AIR/60; y += vy/60; }
    addRun(x + 10, G, 0);
    rails.push(r);
    const f = {type: 'deck', x0: x0 - 3, x1: r.x1 + .5, x2: genX(), rail: r};
    feats.push(f);
    paces.push({x0: x0 + 3, x1: r.x1 - .5, v: 10 + rnd()*2, f});
    const set = orbSet('sprocket');
    for (let x = x0 + 4; x < r.x1 - 1; x += 3) addOrb({x, y: railY(r, x) + 1.1, got: false, air: false}, set);
    lastLaunch = {x1: r.x1, lipY: r.y1, lipSlope: r.slope};
    addRun(16, gradeTarget(d), 0);
    return f;
}

// where the trail asks the rider to slow down, and to what speed
const paceAt = x=> paces.find(p=> x > p.x0 && x < p.x1 && onLine(p, x));
const vFloor = x=> { const p = paceAt(x); return p ? p.v*.85 : VMIN; };

// a little lip then a drop onto a steep landing
function addCliff(d)
{
    const f = addKicker(.4, 3, 'cliff');
    f.D = 3 + rnd()*4 + d*5;
    genBase -= f.D;
    genGrade = .85;
    addRun(18 + f.D*1.5, .55);
    return f;
}

// a kicker over a chasm onto a landing below; the slowest rider always carries it
function addGap(d)
{
    const f = addKicker(1.3 + rnd()*.4, 5, 'gap');
    const drop = 1.2 + rnd()*2.5 + d*2.5, landGrade = .55;
    let W = 5 + rnd()*4 + d*6;
    const a = atan(f.lipSlope), v = VMIN - .6, vx = v*cos(a), vy = v*sin(a);
    const clears = W=>
    {
        const t = (W + 2.5)/vx;
        return vy*t - .5*G_AIR*t*t > -drop - 2.5*landGrade + .5;
    };
    while (W > 3.5 && !clears(W)) W -= .5;
    const n = round(W/DX), floorY = f.lipY - drop - 38;
    for (let k = 1; k <= n; ++k) pushY(floorY, 1);
    f.W = n*DX; f.x2 = genX() + DX*.5; f.drop = drop; f.landY = f.lipY - drop;
    gaps.push(f);
    genBase = f.landY; genGrade = landGrade;
    pushY(genBase + bumpAt(genX() + DX));
    addRun(12, .45);
    return f;
}

// a rock or two, or a log, on a straight stretch
function addRocks(d)
{
    // held at one grade, so no crest throws the bike up into them, with room before them for a flight off
    // the last crest to come down, even on pedal power
    const start = genX(), count = rnd() < .45 + d*.35 ? 2 : 1, len = 34;
    addRun(len, genGrade);
    for (let k = 0; k < count; ++k)
    {
        // a pair sits close, so one jump clears both
        const x = start + 18 + k*(3.6 + rnd()*1.4), log = rnd() < .3;
        rocks.push(log ? {type: 'log', x, w: .3, h: .5, y: groundY(x)} :
            {type: 'rock', x, w: .65 + rnd()*.25, h: .7 + rnd()*.35 + d*.15, y: groundY(x), rot: rnd()*TAU});
    }
    feats.push({type: 'rocks', x0: start, x1: genX()});
}

// a grind rail that starts at the ground and holds a gentler line than the slope, so it ends up in the air
function addRail(d)
{
    const len = 16 + rnd()*14 + d*8, x0 = genX() + 5;
    addRun(len + 14, min(.6, gradeTarget(d) + .1), 0);
    const g = groundSlope(x0 + 2), slope = min(-.06, g*.55);
    const r = {x0, x1: x0 + len, y0: groundY(x0) + .32, slope};
    // never below the ground along the way
    let lift = 0;
    for (let x = x0; x <= r.x1; x += 1) lift = max(lift, groundY(x) + .25 - railY(r, x));
    r.y0 += lift;
    r.mount = railY(r, x0) - groundY(x0) < .55;
    r.y1 = railY(r, r.x1);
    rails.push(r);
    feats.push({type: 'rail', x0: x0 - 3, x1: r.x1 + 3, rail: r});
    const set = orbSet('sprocket');
    for (let x = x0 + 4; x < r.x1 - 1; x += 3) addOrb({x, y: railY(r, x) + 1.1, got: false, air: false}, set);
}

// the sprockets and the battery cells come in sets: pick up every one in a set for its boost
const orbSet = kind=> ({kind, n: 0, got: 0, x1: -1e9, done: false, lost: false});
function addOrb(o, set) { o.set = set; o.cell = set.kind == 'cell'; ++set.n; set.x1 = max(set.x1, o.x); orbs.push(o); }
function orbLine(x0, n, sp, kind='sprocket')
{
    const set = orbSet(kind);
    for (let k = 0; k < n; ++k)
    {
        const x = x0 + k*sp;
        if (x > genX() - 1 || gapAt(x)) continue;
        addOrb({x, y: groundY(x) + 1.1, got: false, air: false}, set);
    }
}
// orbs along the flight off a lip, laid out once the landing below it exists
function orbArc(f)
{
    const a = atan(f.lipSlope), v = f.orbV || ORB_V, b = f.line;
    const ground = x=> b ? brY(b, x) : groundY(x), chasm = x=> b ? brGap(b, x) : gapAt(x);
    let x = f.x1, y = f.lipY + .9, vx = v*cos(a), vy = v*sin(a), t = 0, next = .14;
    // the arc is a guide to the flight, not a set: it comes with every jump
    const set = orbSet('arc');
    while (t < (f.mega ? 4.4 : 3.2) && !(b && x > b.x1 - b.T))
    {
        const dt = 1/60;
        t += dt; x += vx*dt; vy -= G_AIR*dt; y += vy*dt;
        if (y < ground(x) + 1.1 && !chasm(x)) break;
        if (t >= next) { addOrb(b ? {x, y, z: brZ(b, x), got: false, air: true, b} : {x, y, got: false, air: true}, set); next += f.mega ? .2 : .15; }
    }
}

function placeSigns()
{
    while (nextSignX < genX() - 20 && !(openSplit && nextSignX > openSplit.x0 - 40))
    {
        let x = nextSignX;
        for (let k = 0; k < 120 && (feats.some(f=> !f.line && x > f.x0 - 4 && x < (f.x2 || f.x1) + 8) || noSign.some(f=> x > f.x0 && x < f.x1)); ++k) x += 4;
        signs.push({x, d: nextSignX, y: groundY(x)});
        nextSignX += 500;
    }
}

// the farthest a fast rider who also jumps at the lip could fly from a launch, over the ground so far and the
// slope carried on beyond it; a chasm is never put where that flight would come down
function launchReach(f)
{
    if (!f) return -1;
    const a = atan(f.lipSlope), v = max(VMAX + 4, (f.sendV || 0) + 2), gx = genX(), gy = ys[ys.length - 1];
    let x = f.x1, y = f.lipY, vx = v*cos(a) - sin(a)*POP*.5, vy = v*sin(a) + POP;
    for (let t = 0; t < 6; t += 1/60)
    {
        x += vx/60; vy -= G_AIR/60; y += vy/60;
        const g = x <= gx ? groundY(x) : gy - genGrade*(x - gx);
        if (y <= g && !(x <= gx && gapAt(x))) return x;
    }
    return x;
}

// a ravine with a stream at the bottom, crossed on a wooden bridge
function addBridge(d)
{
    addRun(6, min(genGrade, .3), 0);
    const hw = 8 + rnd()*5, x0 = genX();
    addRun(hw*2, min(.24, gradeTarget(d)), 0);
    const g = {xc: x0 + hw, hw, depth: 7 + rnd()*5 + d*4, bridge: true, x0, x1: genX()};
    gullies.push(g);
    feats.push({type: 'bridge', x0, x1: g.x1, g});
    addRun(10, gradeTarget(d), 0);
}
// a creek across the trail: the trail dips through the water
function addCreek(d)
{
    addRun(8, gradeTarget(d), 0);
    const hw = 4.5 + rnd()*2, x0 = genX(), depth = .8 + rnd()*.4, n = round(hw*2/DX);
    for (let k = 1; k <= n; ++k)
    {
        const x = genX() + DX;
        genBase -= genGrade*DX;
        pushY(genBase + bumpAt(x) - depth*(1 - cos(TAU*k/n))/2);
    }
    const g = {xc: x0 + hw, hw, depth: depth + .7, bridge: false, x0, x1: genX()};
    gullies.push(g);
    feats.push({type: 'creek', x0, x1: g.x1, g});
    // climbing out of the dip throws the bike like a small lip
    lastLaunch = {x1: g.x1, lipY: groundY(g.x1), lipSlope: .25};
    addRun(10, gradeTarget(d), 0);
}
// whoops: a run of rollers to pump, or to hop crest to crest
function addWhoops(d)
{
    const n = 4 + (rnd()*3 | 0), L = 8.5 + rnd()*1.5, A = .45 + rnd()*.2 + d*.12, g = gradeTarget(d);
    addRun(6, g, 0);
    const steps = round(n*L/DX), s0 = genX();
    for (let k = 1; k <= steps; ++k)
    {
        const x = genX() + DX;
        genGrade = g; genBase -= g*DX;
        pushY(genBase + bumpAt(x) + A*(1 - cos(TAU*(x - s0)/L))/2);
    }
    feats.push({type: 'whoops', x0: s0, x1: genX(), n, airs: 0});
    // the last crest throws the bike like a lip, so nothing to hit is put where it would come down
    const cx = s0 + (n - .5)*L;
    lastLaunch = {x1: cx, lipY: groundY(cx), lipSlope: -g};
    addRun(8, g, 0);
}

// ---------- the generator
// a block of lines opens on a plain stretch; the main trail carries on with its own features alongside them
function openFork(d)
{

{
    out.w = 0; out.y = y; out.lift = 0;
    if (abs(z) < 1.4) return out;                    // never touch the middle of the main trail
    for (const b of bs)
    {
        if (x <= b.x0 || x >= b.x1) continue;
        const zc = brZ(b, x), d = abs(z - zc);
        if (d > 6.5) continue;
        const m = bermAt(b, x), across = (z - zc)*m.o/hypot(1, m.dz), lift = bermLift(across, m.h);
        const w = 1 - sstep((d - 2.2)/(3.8 + m.h*1.5));
        out.y = mix(out.y, brY(b, x) - .03 + lift, w);
        out.w = max(out.w, 1 - sstep((d - 1.6)/(1.2 + m.h)));
        out.lift = max(out.lift, lift*w);
    }
    // the slope in front of a line down the hill falls away from it, so nothing stands between it and the camera
    for (const b of bs)
    {
        if (b.dir > 0 || x <= b.x0 || x >= b.x1 || brGap(b, x)) continue;
        const zc = brZ(b, x);
        if (z > zc + 2) out.y = min(out.y, mix(out.y, brY(b, x) - .4 - (z - zc - 2)*.45, brT(b, x)));
    }
    return out;
}
function rowY(kind, z, x, p, s, gap)
{
    switch (kind)
    {
        // in front the mountain falls away steeply into a valley far below
        case 'drop': return (gap ? p : s) - 1.6 - (z - 5.6)*.85 - (z - 5.6)**2*.012 + fbm(NB, x*.04, z*.06, 3)*min(5, (z - 5.6)*.35);
        case 'front': return p - 1.5 + NB(x*.2, 4.4)*.25 - bankAt(x)*z*.5;
        case 'edge': return p - .25 - bankAt(x)*z;
        case 'trail': return p + .04*(1 - (z/2.6)**2) - bankAt(x)*z;
        case 'bank': return gap ? s + .4 : mix(p, s, .5) + .4;
    }
    // behind, the mountain's flank climbs steeply to rocky ridges
    const r = -z - 2.6;
    return s + .4 + r*.18 + max(0, r - 8)*.2 - max(0, r - 50)*.32 + fbm(NB, x*.03, z*.06, 3)*min(1, r/14)*MT.hillAmp
        + ridged(NC, x*.012, z*.02 + 3, 3)*min(14, max(0, r - 16)*.3);
}
// how steeply the trail is banked across where it turns, the outside of the turn up
const bankAt = x=> clampV(wzK(x)*7, -.3, .3);
// ravines and creeks cut across the mountain: how far the ground drops into one here.
// A creek dips the trail itself already, so it only cuts the ground off the trail.
function gullyCut(x, z, kind)
{
    let c = 0;
    for (const g of gullies)
    {
        const dx = abs(x - g.xc), w = g.hw + (g.bridge ? .5 : 3);
        if (dx > w) continue;
        if (!g.bridge && (kind == 'trail' || kind == 'edge' || kind == 'front')) continue;
        c = max(c, g.depth*(1 + cos(PI*dx/w))/2/(1 + abs(z)/90));
    }
    return c;
}
// height of the hillside at any z behind the trail, between the rows the mesh draws
function hillY(x, z)
{
    const p = groundY(x), s = smoothY(x), g = gapAt(x);
    for (let r = HILL_ROW; r < ROWS.length - 1; ++r)
    {
        const [za, ka] = ROWS[r], [zb, kb] = ROWS[r + 1];
        if (z <= za && z >= zb)
            return mix(rowY(ka, za, x, p, s, g), rowY(kb, zb, x, p, s, g), (za - z)/(za - zb)) - gullyCut(x, z, 'hill');
    }
    return rowY('hill', z, x, p, s, g) - gullyCut(x, z, 'hill');
}

// the ground's height under a point of the bent world, as the ground mesh has it, lines cut in and all
const TCV = {};
function terrainAt(x, zw)
{
    // back from the bent world to across the trail: the weave moves the ground less the farther it is from the trail
    const w = weaveZ(x);
    let zr = zw - w;
    for (let k = 0; k < 3; ++k) zr = zw - w*weaveK(zr);
    const p = groundY(x), s = smoothY(x), g = gapAt(x), bs = branchesNear(x - 1, x + 1);
    const at = r=> { const [z, kind] = ROWS[r]; return carve(bs, x, z, rowY(kind, z, x, p, s, g) - gullyCut(x, z, kind), TCV).y; };
    if (zr >= ROWS[0][0]) return at(0);
    for (let r = 0; r < ROWS.length - 1; ++r)
        if (zr <= ROWS[r][0] && zr >= ROWS[r + 1][0]) return mix(at(r), at(r + 1), (ROWS[r][0] - zr)/(ROWS[r][0] - ROWS[r + 1][0]));
    return at(ROWS.length - 1);
}
// how far the camera has to rise to see the rider over the ground between them, looked at a few points along the way
function sightLift(rx, ry, rz, cx, cy, cz)
{
    let need = cy;
    // closely enough spaced to catch a sharp edge, like the far side of a chasm
    for (let k = 1; k <= 24; ++k)
    {
        const u = k/25, t = terrainAt(mix(rx, cx, u), mix(rz, cz, u)) + .6;
        if (t > mix(ry, cy, u)) need = max(need, ry + (t - ry)/u);
    }
    return min(need - cy, 25);
}

// a chunk's ground, built a few rows at a time (each yield is a place the work can stop until the next frame).
// What changes only along the trail is worked out once a column; the lighting comes straight off the grid, with a
// column beyond each end so it runs on smoothly into the chunks either side.
function* chunkMeshSteps(ch)
{
    const x0 = ch.x0, y0 = ch.y0, cols = CHN + 1, R = ROWS.length, W = cols + 2, cv = {};
    const bs = branchesNear(x0 - DX, x0 + CH + DX);
    const C = [];
    for (let i = -1; i <= cols; ++i)
    {
        const x = x0 + i*DX, c = {x, p: groundY(x), s: smoothY(x), g: gapAt(x)};
        c.trail = palMix(x, 'trail', [0,0,0]); c.hill = palMix(x, 'hill', [0,0,0]); c.hill2 = palMix(x, 'hill2', [0,0,0]);
        c.rock = palMix(x, 'rock', [0,0,0]); c.face = palMix(x, 'face', [0,0,0]);
        c.alpine = MT.snow > 5 ? 0 : biomeW(x, BWS).alpine;
        C.push(c);
    }
    yield;
    // the points, every row of every column including the extra two, and the colors of the chunk's own
    const P = new Array(W*R), col = [];
    for (let j = 0; j < R; ++j)
    {
        const [z, kind] = ROWS[j];
        for (let q = 0; q < W; ++q)
        {
            const c = C[q], x = c.x;
            carve(bs, x, z, rowY(kind, z, x, c.p, c.s, c.g) - gullyCut(x, z, kind), cv);
            // bent sideways with the weave
            P[j*W + q] = vec3(x - x0, cv.y - y0, wz(x, z));
            if (q == 0 || q == W - 1) continue;
            const n = NV(x*.21, z*.21)*.07 + NV(x*.05, z*.05 + 9)*.08;
            let color;
            if (kind == 'trail' || kind == 'edge')
            {
                const t = c.trail, k = (kind == 'edge' ? .62 : abs(z) > 2 ? .84 : 1.04) + n;
                color = new Color(t[0]*k, t[1]*k, t[2]*k);
            }
            else if (kind == 'front' || kind == 'drop')
            {
                // the slope falling away in front: hillside with rocky bands, shaded as it drops
                const h = c.hill, fc = c.face, rockW = sstep(fbm(NC, x*.03 + 3, z*.05, 2)*2.2 + .1), k = (1.02 - min(.35, (z - 5.6)*.014)) + n;
                color = new Color(mix(h[0], fc[0], rockW)*k, mix(h[1], fc[1], rockW)*k, mix(h[2], fc[2], rockW)*k);
            }
            else
            {
                const h = c.hill, r2 = c.hill2, rk = c.rock, rr = -z - 2.6, t = sstep(fbm(NC, x*.02, z*.04, 2)*1.6 + .5);
                const rockW = sstep(fbm(NC, x*.015 + 7, z*.03, 2)*2.2 + rr/90*.7 - .35);
                let cr = mix(h[0], r2[0], t), cg = mix(h[1], r2[1], t), cb = mix(h[2], r2[2], t);
                cr = mix(cr, rk[0], rockW); cg = mix(cg, rk[1], rockW); cb = mix(cb, rk[2], rockW);
                // snow lies on the high slopes of alpine country too
                const snowW = c.alpine*sstep((rr - 45)/30)*.8;
                cr = mix(cr, .92, snowW); cg = mix(cg, .94, snowW); cb = mix(cb, .98, snowW);
                const k = 1 + n;
                color = new Color(cr*k, cg*k, cb*k);
            }
            if (cv.w > 0)
            {
                const t = c.trail, k = .9 + n - cv.lift*.09;
                color = new Color(mix(color.r, t[0]*k, cv.w), mix(color.g, t[1]*k, cv.w), mix(color.b, t[2]*k, cv.w));
            }
            col.push(color);
        }
        if (j % 2) yield;
    }
    // smooth normals from the neighbours along and across, and the chunk's own points
    const pts = [], nrm = [], ind = [];
    for (let j = 0; j < R; ++j)
    {
        const ja = max(0, j - 1)*W, jb = min(R - 1, j + 1)*W;
        for (let q = 1; q < W - 1; ++q)
        {
            const l = P[j*W + q - 1], r = P[j*W + q + 1], u = P[ja + q], d = P[jb + q];
            const tx = r.x - l.x, ty = r.y - l.y, tz = r.z - l.z, bx = d.x - u.x, by = d.y - u.y, bz = d.z - u.z;
            const nx = ty*bz - tz*by, ny = tz*bx - tx*bz, nz = tx*by - ty*bx, n = hypot(nx, ny, nz);
            pts.push(P[j*W + q]);
            nrm.push(n > 1e-9 ? vec3(nx/n, ny/n, nz/n) : vec3(0, 1, 0));
        }
        if (j % 10 == 9) yield;
    }
    for (let j = 0; j < R - 1; ++j)
    for (let i = 0; i < cols - 1; ++i)
    {
        const a = j*cols + i, b = a + 1, d = a + cols + 1, e = a + cols;
        ind.push(a, b, d, a, d, e);
    }
    yield;
    const mesh = new Mesh().addTriangles(pts, ind, nrm, undefined, col);
    mesh.doubleSided = true;
    ch.mesh = mesh;
}

// an object placed at a world position, moved when the origin moves; z is across the trail, bent by the weave
function anchor(o, x, y, z=0) { return anchorW(o, x, y, wz(x, z)); }
// one placed at a z already bent, or one whose mesh is built bent around z 0
function anchorW(o, x, y, zw)
{
    o.ax = x; o.ay = y; o.az = zw;
    o.pos3D = vec3(x - OX, y - OY, zw);
    return o;
}
// turned to run along the trail where it is
function alongTrail(o, x, z=0)
{
    const r = o.rotation3D || vec3();
    o.rotation3D = vec3(r.x, r.y - atan(wzD(x, z)), r.z);
    return o;
}
const placeAnchor = o=> o.pos3D = vec3(o.ax - OX, o.ay - OY, o.az);

// a chunk of the world, built a step at a time; nothing is put into the scene until the last step, so a chunk
// given up on part way leaves nothing behind
function* buildChunk(i)
{
    const x0 = i*CH, ch = {i, x0, y0: groundY(x0), objs: [], sets: []};
    const rr = mulberry(seed*131 + i*977 + 5);
    yield* chunkMeshSteps(ch);

    // trees and bushes on the hillside behind, a few rocks and bushes on the slope in front
    const w = biomeW(x0 + CH/2, {}), lists = {pine: [], snowPine: [], broad: [], bush: [], rock: [], crag: []};
    // nothing grows on a branch, or between it and the camera
    const bsN = branchesNear(x0 - 6, x0 + CH + 6);
    const clearOf = (x, z)=> !bsN.some(b=> x > b.x0 - 5 && x < b.x1 + 5 && (b.dir > 0 ? z > b.z - 4.5 : z < b.z + 34 && z > 1))
        && !gullies.some(g=> abs(x - g.xc) < (g.bridge ? 4 : 3.5)) && !arches.some(a=> abs(x - a.x) < 4 && abs(z) < 11);
    const nTrees = round(8*w.snow + 14*w.alpine + 60*w.forest + 46*w.autumn + 10*w.desert);
    for (let k = 0; k < nTrees*1.4; ++k)
    {
        const x = x0 + rr()*CH, z = -5.5 - rr()**.8*82, wl = biomeW(x, BWS);
        // forests grow in patches, thinning out high up the hill
        const dens = sstep(fbm(NF2, x*.02, z*.03, 2)*2 + .55) * (1 - sstep((-z - 60)/30)*.6);
        if (rr() > dens || !clearOf(x, z)) continue;
        const y = hillY(x, z) - .25, sc = .7 + rr()*.7;
        const pick = rr();
        let kind = 'pine';
        if (pick < wl.desert) { kind = rr() < .55 ? 'bush' : 'rock'; lists[kind].push({x, y: hillY(x, z) - .1, z, s: sc*(kind == 'rock' ? 1.6 : 1.1), rot: rr()*TAU, t: rr()}); continue; }
        if (pick < wl.desert + wl.snow) kind = 'snowPine';
        else if (pick < wl.desert + wl.snow + wl.autumn*.75) kind = 'broad';
        lists[kind].push({x, y, z, s: sc*(kind == 'broad' ? .9 : 1), rot: rr()*TAU, t: rr()});
        if (k % 40 == 39) yield;
    }
    yield;
    // trees down the slope in front too, far enough below the trail that they never hide the rider
    for (let k = 0; k < nTrees*.6; ++k)
    {
        const x = x0 + rr()*CH, z = 23 + rr()*36, wl = biomeW(x, BWS), pick = rr(), sc = .8 + rr()*.7, t = rr();
        if (rr() > sstep(fbm(NF2, x*.02 + 5, z*.03, 2)*2 + .45) || !clearOf(x, z) || gapAt(x)) continue;
        const y = rowY('drop', z, x, groundY(x), smoothY(x), 0) - gullyCut(x, z, 'drop') - .3;
        const kind = pick < wl.desert ? 'bush' : pick < wl.desert + wl.snow ? 'snowPine' : pick < wl.desert + wl.snow + wl.autumn*.75 ? 'broad' : 'pine';
        lists[kind].push({x, y, z, s: sc*(kind == 'bush' ? 1.3 : 1), rot: rr()*TAU, t});
    }
    yield;
    for (let k = 0; k < 18; ++k)
    {
        const x = x0 + rr()*CH, z = -4.5 - rr()*60;
        if (!clearOf(x, z)) { rr(); rr(); rr(); rr(); continue; }
        if (rr() < .5) lists.bush.push({x, y: hillY(x, z) - .1, z, s: .6 + rr()*.8, rot: rr()*TAU, t: rr()});
        else lists.rock.push({x, y: hillY(x, z) + .1, z, s: .5 + rr()*1.6, rot: rr()*TAU, t: rr()});
    }
    for (let k = 0; k < 7; ++k)
    {
        const x = x0 + rr()*CH, z = 7 + rr()*7;
        if (gapAt(x) || gapAt(x + 2) || gapAt(x - 2) || !clearOf(x, z)) continue;
        const y = rowY('drop', z, x, groundY(x), smoothY(x), 0) - gullyCut(x, z, 'drop');
        lists.rock.push({x, y, z, s: .8 + rr()*1.8, rot: rr()*TAU, t: rr()});
    }
    for (let k = 0; k < 4; ++k)
    {
        const x = x0 + rr()*CH, z = 4.2 + rr()*1.3;
        if (gapAt(x) || gapAt(x + 1) || gapAt(x - 1) || !clearOf(x, z)) continue;
        const y = mix(groundY(x) - .25, groundY(x) - 1.5, (z - 3.8)/1.8);
        (rr() < .5 ? lists.bush : lists.rock).push({x, y, z, s: .35 + rr()*.4, rot: rr()*TAU, t: rr()});
    }
    // crags: rock spires up the flank behind and down the slope in front
    for (let k = 0; k < 9; ++k)
    {
        const x = x0 + rr()*CH, back = rr() < .65, z = back ? -9 - rr()*60 : 19 + rr()*28, sz = 1.4 + rr()*2.6, t = rr();
        if (!clearOf(x, z) || gapAt(x)) continue;
        const y = back ? hillY(x, z) - .6 : rowY('drop', z, x, groundY(x), smoothY(x), 0) - gullyCut(x, z, 'drop') - .4;
        lists.crag.push({x, y, z, s: sz, rot: rr()*TAU, t, tall: 1.2 + t*2.2});
    }
    yield;
    const ground = anchorW(new EngineObject3D(vec3(), ch.mesh), x0, ch.y0, 0);
    ground.castShadow = false;
    ch.objs.push(ground);
    const palAt = (x, key)=> palMix(x, key, [0,0,0]);
    const tint = {
        pine: t=> hsl(.0, 0, .82 + t.t*.3),
        snowPine: t=> hsl(.0, 0, .85 + t.t*.25),
        broad: t=> hsl(.02 + t.t*.11, .9, .5 + t.t*.1),
        bush: t=> { const c = palAt(t.x, 'hill2'), d = biomeW(t.x, BWS).desert; return new Color(mix(c[0]*1.3, .5, d), mix(c[1]*1.3, .55, d), mix(c[2]*1.3, .35, d)); },
        rock: t=> { const c = palAt(t.x, 'rock'); const k = .85 + t.t*.3; return new Color(c[0]*k, c[1]*k, c[2]*k); },
        crag: t=> { const c = palAt(t.x, 'face'), r = palAt(t.x, 'rock'), k = .85 + t.t*.25; return new Color(mix(c[0], r[0], .5)*k, mix(c[1], r[1], .5)*k, mix(c[2], r[2], .5)*k); }};
    // autumn broadleaf is colored per tree; elsewhere it is green
    const broadTint = t=> biomeW(t.x, BWS).autumn > .5 ? tint.broad(t) : hsl(.27 + t.t*.05, .55, .35 + t.t*.1);
    for (const [kind, list] of Object.entries(lists))
    {
        if (!list.length) continue;
        const set = new InstancedMesh3D(M[kind], list.length);
        set.castShadow = kind != 'bush';
        ch.sets.push({set, list, kind, color: kind == 'broad' ? broadTint : tint[kind]});
    }

    // things on the track in this chunk
    for (const r of rocks) if (r.x >= x0 && r.x < x0 + CH) ch.objs.push(makeRock(r));
    for (const r of rails) if (r.x0 >= x0 && r.x0 < x0 + CH) ch.objs.push(r.deck ? makeDeck(r) : makeRail(r));
    for (const s of signs) if (s.x >= x0 && s.x < x0 + CH) ch.objs.push(...makeSign(s));
    if (i == 0) ch.objs.push(...makeSummit());
    for (const g of gullies) if (g.x0 >= x0 && g.x0 < x0 + CH) { ch.objs.push(makeWater(g)); if (g.bridge) ch.objs.push(makeBridge(g)); }
    for (const a of arches) if (a.x >= x0 && a.x < x0 + CH) ch.objs.push(makeArch(a));
    for (const f of feats) if (f.type == 'dropin' && f.x1 >= x0 && f.x1 < x0 + CH) ch.objs.push(...makeDropMarks(f));
    for (const sp of splits)
    {
        if (sp.x0 >= x0 && sp.x0 < x0 + CH) ch.objs.push(...makeForkSign(sp));
    }
    placeChunk(ch);
    chunks.set(i, ch);
}

function placeChunk(ch)
{
    for (const o of ch.objs) placeAnchor(o);
    for (const {set, list, kind, color} of ch.sets)
        list.forEach((t, i)=>
        {
            const rot = kind == 'rock' ? vec3(t.rot*.3, t.rot, t.rot*.2) : kind == 'crag' ? vec3(t.t*.15, t.rot, t.t*.1) : vec3(0, t.rot, 0);
            const sc = kind == 'rock' ? vec3(t.s, t.s*.7, t.s*.9) : kind == 'crag' ? vec3(t.s, t.s*t.tall, t.s*.85) : vec3(t.s);
            set.setTransformAt(i, vec3(t.x - OX, t.y - OY, wz(t.x, t.z)), rot, sc);
            set.setColorAt(i, color(t));
        });
}

function destroyChunk(ch)
{
    for (const o of ch.objs) o.destroy();
    for (const s of ch.sets) s.set.destroy();
    ch.mesh.dispose?.();
    chunks.delete(ch.i);
}

// keep the chunks around the camera built: the nearest one missing is built a step at a time within a slice of
// each frame, so no frame stalls on it; all at once when the world is laid out fresh
const CHUNK_MS = 3;
let chunkJob = null;
function updateChunks(camX, force, more=0)
{
    const a = floor((camX - 150)/CH), b = floor((camX + 400 + more)/CH), until = performance.now() + (force ? 1e9 : CHUNK_MS);
    if (chunkJob && (chunkJob.i < a - 1 || chunkJob.i > b + 2)) chunkJob = null;
    while (performance.now() < until)
    {
        if (!chunkJob)
        {
            let i = max(0, a);
            while (i <= b && chunks.has(i)) ++i;
            if (i > b) break;
            chunkJob = {i, steps: buildChunk(i)};
        }
        let done;
        while (!(done = chunkJob.steps.next().done) && performance.now() < until);
        if (done) chunkJob = null;
    }
    for (const ch of [...chunks.values()])
        if (ch.i < a - 1 || ch.i > b + 2) destroyChunk(ch);
}

// ---------- obstacles, rails, signs and the summit
function makeRock(r)
{
    let o;
    if (r.type == 'log')
    {
        o = new EngineObject3D(vec3(), M.log, undefined, hsl(.07,.45,.3));
        o.rotation3D = vec3(PI/2, 0, .1);
        o.scale3D = r.smashed ? vec3(0) : vec3(1, 1, 1);
        r.obj = o;
        return alongTrail(anchor(o, r.x, r.y + .22, -.2), r.x);
    }
    o = new EngineObject3D(vec3(), M.boulder, undefined, hsl(.08,.05,.47));
    o.scale3D = r.smashed ? vec3(0) : vec3(r.w*2.2, r.h*1.25, 2.2);
    o.rotation3D = vec3(0, r.rot, 0);
    r.obj = o;
    return anchor(o, r.x, r.y + r.h*.35, 0);
}

function makeRail(r)
{
    const mesh = new Mesh, len = r.x1 - r.x0, a = atan(r.slope), dl = len/cos(a);
    const wood = hsl(.08,.45,.34), wood2 = hsl(.08,.4,.25), steel = hsl(.6,.08,.7);
    const mid = vec3(len/2, r.slope*len/2, 0);
    mesh.combine(buildBox(vec3(dl, .16, .32)).setColor(wood), buildMatrix(mid.add(vec3(0, -.1, 0)), vec3(0, 0, a)));
    mesh.combine(buildBox(vec3(dl, .05, .1)).setColor(steel), buildMatrix(mid.add(vec3(0, .01, 0)), vec3(0, 0, a)));
    for (let x = .3; x < len; x += 3)
    {
        const top = r.slope*x - .15, bottom = groundY(r.x0 + x) - r.y0 - .3, hgt = top - bottom;
        if (hgt > .05) mesh.combine(buildBox(vec3(.16, hgt, .16)).setColor(wood2), vec3(x, (top + bottom)/2, 0));
    }

// ---------- the Bluecow Rager logo in 3D, standing on the trail below the start for the menu: a plaque cut to the
// logo's outline, its lettering, cow and mountains raised in relief off the black, on two posts
const LOGO_W = 8, LOGO_X = START_X + 20, LOGO_YAW = -.55, LOGO_LIFT = 1.25, LOGO_N = vec3(sin(LOGO_YAW), 0, cos(LOGO_YAW));
let logo = null;
function loadLogo()
{
    const img = new Image();
    img.onload = ()=> { try { logo = buildLogo(img); } catch(e) { console.warn('logo', e); } };
    img.src = BLUECOW_LOGO;
}
function buildLogo(img)
{
    // the picture read at the grid's resolution: how solid it is, and how high each point stands
    const NX = 160, NY = round(NX*img.height/img.width), cw = NX + 1, rows = NY + 1;
    const cv = document.createElement('canvas'); cv.width = cw; cv.height = rows;
    const g = cv.getContext('2d', {willReadFrequently: true});
    g.drawImage(img, 0, 0, cw, rows);

    }

        {
            let t = 0, n = 0;
            for (let dj = -1; dj <= 1; ++dj) for (let di = -1; di <= 1; ++di)
            {
                const a = i + di, c = j + dj;
                if (a >= 0 && a < cw && c >= 0 && c < rows) { t += Hm[c*cw + a]; ++n; }
            }
            o[j*cw + i] = t/n;
        }

    }

    const at = (i, j)=> j*cw + i, X = i=> i*s - w/2, Y = j=> h - j*s;
    const fp = [], fn = [], fu = [], bp = [], bn = [], fi = [], bi = [];
    for (let j = 0; j < rows; ++j) for (let i = 0; i < cw; ++i)
    {
        const H = k=> Hm[k]*relief, k = at(i, j);
        const dx = (H(at(min(NX, i + 1), j)) - H(at(max(0, i - 1), j)))/(2*s), dy = (H(at(i, max(0, j - 1))) - H(at(i, min(NY, j + 1))))/(2*s);
        fp.push(vec3(X(i), Y(j), H(k))); fn.push(vec3(-dx, -dy, 1).normalize()); fu.push(vec2(i/NX, j/NY));

    {

    };

    for (let j = 0; j < NY; ++j) for (let i = 0; i < NX; ++i)
    {
        const tl = A[at(i, j)], tr = A[at(i + 1, j)], br = A[at(i + 1, j + 1)], bl = A[at(i, j + 1)];
        const cs = (tl > .5) | (tr > .5) << 1 | (br > .5) << 2 | (bl > .5) << 3;
        if (!EDGES[cs].length) continue;
        const f = (p, q)=> (.5 - p)/(q - p || 1e-6);

        for (const [e0, e1] of EDGES[cs])

// where the logo stands, and how it is turned, rocked by a knock, and toppled over backwards when the ride starts

const logoH = ()=> logo ? logo.h : LOGO_W*.8;
function logoMatrix()
{
    // it rocks and falls about the back edge of its foot
    const b = logoBase();
    return Matrix4.translation(vec3(b.x - OX, b.y - OY, b.z))
        .multiply(Matrix4.rotation(vec3(0, LOGO_YAW, 0)))
        .multiply(Matrix4.translation(vec3(0, 0, -.45)))
        .multiply(Matrix4.rotation(vec3(-logoWob - logoFall, 0, logoFall ? 0 : sin(time*.7)*.012)))

}

// a trick still under way when the wheels touch: nearly done it counts, half done it is sketchy, barely begun a crash
function finishTrick()
{
    if (!style) return true;
    const p = styleT/style.dur;
    // a short hop that came down before the trick got going just drops it
    if (p < .4 && airT < .4) { style = undefined; trickQueued = null; return true; }
    if (p < .4) { crash(style.fail || 'FEET OFF THE PEDALS'); return false; }
    if (p >= .8) stylesDone.push(style);
    else { showMessage('SKETCHY!', 'finish the trick before landing', hsl(.08,.9,.6)); sfx('landHard'); ++sketchy; }
    style = undefined; trickQueued = null;
    return true;
}

// a flick in the air throws the trick for its direction; one waits its turn behind a trick under way
function airSwipe(dir)
{
    if (state != 'ride') return false;
    const name = SWIPE_TRICKS[(dir % 8 + 8) % 8];
    // on the ground it waits a moment for the takeoff
    if (grounded || grinding) { trickBuf = .3; trickBufName = name; }
    else trickQueued = name;
    everSwiped = true; ++swipeCount;
    return true;
}

// ---------- tricks build a combo; it banks when the rider rolls on without another trick for a moment
function addTrick(name, pts, key, bonus=false)
{
    pts = round(pts*max(boostMult(), grounded || grinding ? 1 : airMult)/10)*10;
    // a set's bonus joins the combo but is not a trick of the run
    if (!bonus && pts > bestTrick.pts) bestTrick = {name, pts};
    ++combo; comboPts += pts; comboT = 2.2;
    charge(pts);
    comboNames.push(name);
    if (key) comboKeys.push(key);
    if (combo >= 2) boostT = max(boostT, .5 + min(combo, 6)*.12);
    showTrick(name, pts);
}
function bankCombo()
{
    if (!combo) return;
    const total = comboPts*min(combo, 10);
    score += total; ++combosBanked; multSum += min(combo, 10);
    if (total > bestCombo) bestCombo = total, bestComboName = comboNames.slice(-3).join(' + ');
    if (combo > 1) showBank('x' + min(combo, 10) + ' COMBO', total);
    sfx(combo > 1 ? 'bank' : 'trick');
    combo = comboPts = 0; comboNames = []; comboKeys = []; comboT = 0;
}

function scoreAir(perfect)
{
    const n = abs(rot) > TAU*.7 ? max(1, round(abs(rot)/TAU)) : 0, back = rot > 0;
    let flipName = '', flipPts = 0;
    if (n)
    {
        flipName = (n == 2 ? 'DOUBLE ' : n == 3 ? 'TRIPLE ' : n > 3 ? n + 'X ' : '') + (back ? 'BACKFLIP' : 'FRONTFLIP');
        flipPts = round((back ? 500 : 650)*(n == 1 ? 1 : n == 2 ? 2.6 : 4.5));
        flipsTotal += n;
        countTrick(back ? 'BACKFLIP' : 'FRONTFLIP', n);
        sfx('trickBig');
    }
    // each trick in one air is worth more than the one before, a repeat in the same combo half as much;
    // the first one thrown during a flip joins it, for a bonus
    stylesDone.forEach((t, k)=>
    {
        const reps = comboKeys.filter(c=> c == t.name).length;
        let name = t.name, pts = t.pts*1.25**min(k, 4)*.5**reps;
        if (k == 0 && n)
        {
            name = t.name == 'TAILWHIP' ? flipName.replace('BACKFLIP', 'FLIP WHIP').replace('FRONTFLIP', 'FRONT FLIP WHIP') : t.name + ' ' + flipName;
            pts = (pts + flipPts)*1.5;
            flipName = '';
        }
        addTrick(name, round(pts/10)*10, t.name);
        countTrick(t.name); ++tricksTotal;
    });
    if (flipName) addTrick(flipName, flipPts);
    if (takeoffKind == 'gap' && airT > .3) { addTrick('CHASM', 300); countTrick('CHASM'); }
    if (takeoffKind == 'canyon' && airT > .3 && px > takeoffFeat?.x2) { addTrick('CANYON GAP', 600); countTrick('CANYON GAP'); }
    if (takeoffKind == 'stepdown' && takeoffY - py > 3) { addTrick('STEP-DOWN', 200); countTrick('STEP-DOWN'); }
    if (takeoffFeat?.type == 'deck' && takeoffY - py > 4) { addTrick('DECK DROP ' + round(takeoffY - py) + 'm', round((takeoffY - py)*40/10)*10); countTrick('DECK DROP'); }
    if (takeoffKind == 'cliff' && takeoffY - py > 4) addTrick('DROP ' + round(takeoffY - py) + 'm', round((takeoffY - py)*40));
    if (takeoffFeat?.type == 'dropin' && takeoffY - py > 4)
    {
        addTrick('DROP-IN ' + round(takeoffY - py) + 'm', round((takeoffY - py)*50/10)*10);
        countTrick('DROP-IN');
        if (sentIt) { addTrick('SEND IT', 300); countTrick('SEND IT'); }
    }
    if (airT > 1.6) addTrick('BIG AIR', round(airT*120));
    if (perfect && airT > .45 && (n || stylesDone.length || airT > .9)) addTrick('PERFECT', 150);
    else if (perfect && airT > .45) { boostT = max(boostT, .35); sfx('perfect'); }
}

// ---------- grinding along a rail
function startGrind(r)
{
    const th = atan(r.slope), err = wrapPI(ang - th);
    if (abs(err) > .85) { crash(r.deck ? 'BAD LANDING' : 'MISSED THE RAIL'); return; }
    if (!grounded && !finishTrick()) return;
    if (!grounded) scoreAir(abs(err) < .22);
    grinding = r; grounded = false;
    sp = max(VMIN, vx*cos(th) + vy*sin(th));
    py = railY(r, px); ang = th; angVel = 0; landVis = err;
    grindStart = px;
    sfx(r.deck ? (grounded ? 'click' : 'land') : 'grind');
}
function endGrind(popped)
{
    const len = grinding ? px - grindStart : 0;
    if (len > 2 && grinding.deck) addTrick('SHORE ' + round(len) + 'm', round(len*15));
    else if (len > 2)
    {
        grindDist += len;
        addTrick('GRIND ' + round(len) + 'm', round(len*28));
    }
    grinding = null;
}
function stepGrind(dt)
{
    const r = grinding, th = atan(r.slope), c = cos(th), sn = sin(th);
    if (r.deck)
    {
        // a deck rolls like the ground, and brakes down to a roll before its end
        const pace = paceAt(px);
        sp = clampV(sp + (-G_RIDE*sn - DRAG*sp*sp - CRR*G_RIDE + (turboT > 0 && !pace ? 12 : 0))*dt, vFloor(px), VMAX + bike.speed + (turboT > 0 ? TURBO_V : 0));
        braking = !!pace && sp > pace.v;
        if (braking) sp = max(pace.v, sp - 12*dt);
    }
    else sp = clampV(sp + (-G_RIDE*sn - DRAG*sp*sp - .25 + (turboT > 0 ? 12 : 0))*dt, VMIN*.85, VMAX + bike.speed + (turboT > 0 ? TURBO_V : 0));
    px += sp*c*dt; py = railY(r, px);
    surfNow = S_WOOD;
    if (px >= r.x1)
    {
        vx = sp*c; vy = sp*sn;
        endGrind(false);
        takeoff('rail');
    }
}

// ---------- rocks and logs
function checkRocks()
{
    if (onBranch(px) && abs(riderZ()) > 1.5) return;
    for (const r of rocks)
    {
        if (r.smashed || abs(px - r.x) > r.w + .4 || py >= r.y + r.h - .18) continue;
        // on the turbo, and just after it while still flying, the bike goes straight through
        if (turboT > 0 || turboGrace > 0)
        {
            r.smashed = true;
            if (r.obj) r.obj.scale3D = vec3(0);
            addTrick('SMASH', 150); ++smashes;
            rockBurst(r);
            sfx('landHard', .8);
            camShake = max(camShake, .6);
            continue;
        }
        if (r.type == 'log')
        {
            // a log is small enough to roll over: the bike bucks up and loses speed
            if (r.hit) continue;
            r.hit = true;
            sp *= .78;
            if (grounded) { const th = atan(rideSlope(px)); vx = sp*cos(th); vy = sp*sin(th) + 3.2; py += .05; takeoff('log'); }
            suspFV += 2; suspRV += 2; camShake = max(camShake, .35);
            sfx('landHard', .5);
            showMessage('BUMP!', 'tap to hop logs', hsl(.08,.9,.6));
            continue;
        }
        // coming down on top of a rock bounces off it; only riding into its face is a crash
        if (!grounded && !grinding && vy < 0 && py > r.y + r.h*.4)
        {
            if (r.hit) continue;
            r.hit = true;
            py = r.y + r.h + .05; vy = 4.5; sp *= .9; vx = sp*cos(ang);
            suspFV += 2.5; suspRV += 2.5; camShake = max(camShake, .4);
            sfx('landHard', .6);
            addTrick('ROCK BOUNCE', 120);
            continue;
        }
        crash('HIT A ROCK');
        return;
    }
}

// ---------- crashing: a run ends with a tumble
function crash(reason)
{
    if (state != 'ride') return;
    state = 'crash'; crashT = 0; crashReason = reason;
    window.__lastCrash = {reason, px: +px.toFixed(1), ride: ride ? ride.lane : 0, z: +riderZ().toFixed(1), turbo: +turboT.toFixed(2), tk: takeoffKind, tkx: +takeoffX.toFixed(1), rot: +(rot*57).toFixed(0), ang: +(ang*57).toFixed(0), slope: +(atan(rideSlope(px))*57).toFixed(0), airT: +airT.toFixed(2), sp: +sp.toFixed(1), vx: +vx.toFixed(1), vy: +vy.toFixed(1), style: style?.name, styleT: +styleT.toFixed(2), flightT: window.__flightT, grounded, frame};
    combo = comboPts = 0; comboNames = []; comboKeys = []; grinding = null; style = undefined; trickQueued = null;
    startWreck();
    saveBest(); groanAt = 2.2;
    sfx('crash');
    camShake = 1;
    dustBurst(px, py, 90);
    showMessage('YARD SALE!', reason.toLowerCase(), hsl(.02,.9,.62));
}

// ---------- the wreck: the rider goes limp and tumbles as a ragdoll, arms and legs flailing on the way down, and the
// bike flies apart into its pieces beside them, the wheels rolling off down the mountain
// the rider's joints in the bike's own space, before scaling, and how round each is
const RAG_POSE = [
    ['head', 0, 1.78, -.21, .17], ['chest', 0, 1.49, -.1, .14], ['hip', 0, 1.16, .3, .14],
    ['shL', .2, 1.52, -.12, .08], ['shR', -.2, 1.52, -.12, .08], ['elL', .45, 1.28, -.25, .06], ['hdL', .37, 1.08, -.46, .06],
    ['elR', -.45, 1.28, -.25, .06], ['hdR', -.37, 1.08, -.46, .06], ['hpL', .11, 1.16, .3, .09], ['hpR', -.11, 1.16, .3, .09],
    ['knL', .25, .8, -.2, .07], ['ftL', .17, .38, .05, .07], ['knR', -.25, .8, -.2, .07], ['ftR', -.17, .38, .05, .07]];
const RAG_I = Object.fromEntries(RAG_POSE.map((p, i)=> [p[0], i]));
// the torso and head braced into one piece; the arms and legs hang off it loose
const RAG_BONES = [['head', 'chest'], ['chest', 'hip'], ['head', 'hip'], ['shL', 'shR'], ['shL', 'chest'], ['shR', 'chest'],
    ['shL', 'hip'], ['shR', 'hip'], ['hpL', 'hpR'], ['hpL', 'hip'], ['hpR', 'hip'], ['hpL', 'chest'], ['hpR', 'chest'],
    ['shL', 'hpL'], ['shR', 'hpR'], ['head', 'shL'], ['head', 'shR'],
    ['shL', 'elL'], ['elL', 'hdL'], ['shR', 'elR'], ['elR', 'hdR'], ['hpL', 'knL'], ['knL', 'ftL'], ['hpR', 'knR'], ['knR', 'ftR']]
    .map(([a, b])=> [RAG_I[a], RAG_I[b]]);
const LIMB_ENDS = ['hdL', 'hdR', 'ftL', 'ftR'].map(n=> RAG_I[n]);
// the bike's pieces: what of it each is, its middle in the bike's space, and how big it is
const PIECES = [['rw', 0, .37, .62, .37, true], ['fw', 0, .37, -.64, .37, true], ['frame', 0, .6, .05, .35],
    ['fork', 0, .62, -.55, .25], ['bars', 0, 1.08, -.46, .3], ['seat', 0, 1.02, .2, .12], ['crank', 0, .34, .05, .17]];
let ragdoll = null, pieces = [], wreckSfxT = 0, crashCam = 0, wheelSpinAtCrash = 0;
function startWreck()
{
    const M = bikeMatrix(), rnd = ()=> Math.random() - .5, spin = -(6 + Math.random()*6);
    const pts = RAG_POSE.map(([n, x, y, z, rad])=> { const p = M.transformPoint(vec3(x, y, z)); return {x: p.x + OX, y: p.y + OY, z: p.z, r: rad*RS}; });
    // a rider coming down on their head starts partly in the ground: lifted out of it first
    const lift = max(0, ...pts.map(p=> terrainAt(p.x, p.z) + p.r - p.y));
    for (const p of pts) p.y += lift;
    const hip = pts[RAG_I.hip], ux = vx*.65, uy = max(vy, 0)*.3 + 2.5;
    // thrown on at the bike's speed, tumbling head over heels, every limb a little its own way
    for (const p of pts)
    {
        p.vx = ux - spin*(p.y - hip.y) + rnd()*3; p.vy = uy + spin*(p.x - hip.x) + rnd()*3; p.vz = rnd()*2;
        p.phase = Math.random()*TAU;
    }
    const len = RAG_BONES.map(([a, b])=> hypot(pts[a].x - pts[b].x, pts[a].y - pts[b].y, pts[a].z - pts[b].z));
    ragdoll = {pts, len};
    // the bike bursts apart from its middle
    const mid = M.transformPoint(vec3(0, .6, 0));
    pieces = PIECES.map(([key, x, y, z, rad, wheel])=>
    {
        const c = vec3(x, y, z), w = M.transformPoint(c), R = M.copy(), out = w.subtract(mid);
        R.m[12] = R.m[13] = R.m[14] = 0;
        return {key, c, x: w.x + OX, y: w.y + OY, z: w.z, r: rad*RS, wheel, R, tipAt: 1.5 + Math.random()*2,
            vx: vx*(wheel ? .65 : .6) + out.x*3 + rnd()*3, vy: max(vy, 0)*.4 + 2 + out.y*3 + Math.random()*2.5, vz: out.z*4 + rnd()*5,
            w: wheel ? vec3(rnd()*2, rnd()*2, -vx/(rad*RS)*.6) : vec3(rnd()*14, rnd()*14, rnd()*14)};
    });
    wheelSpinAtCrash = wheelSpin;
    rag = {x: hip.x, y: hip.y, z: hip.z};
}
// on the menu the rider smacks into the logo: nothing of the wreck goes through it, and it stays on the trail in
// front of it rather than tumbling away down the hillside
function offLogo(p, bounce)
{
    const zr = p.z - wz(p.x, 0), zc = clampV(zr, -2.2, 2.2);
    if (zc != zr) { p.z += zc - zr; if (bounce) p.vz = 0; }
    const b = logoBase(), d = (p.x - b.x)*LOGO_N.x + (p.z - b.z)*LOGO_N.z - p.r - .05;
    if (d >= 0 || p.y < b.y + LOGO_LIFT - .3) return;
    p.x -= d*LOGO_N.x; p.z -= d*LOGO_N.z;
    if (!bounce) return;
    const vn = p.vx*LOGO_N.x + p.vz*LOGO_N.z;
    if (vn < 0) { p.vx -= 1.4*vn*LOGO_N.x; p.vz -= 1.4*vn*LOGO_N.z; wreckSound('clank', -vn); }
}
// a thud or a clank as something hits the ground hard, not too many at once
function wreckSound(name, hit)
{
    if (hit < 5 || time < wreckSfxT) return;
    wreckSfxT = time + .09;
    sfx(name);
}
function stepWreck(dt)
{
    const n = 3, h = dt/n, P = ragdoll.pts;
    for (let s = 0; s < n; ++s)
    {
        // the ragdoll: moved, then its bones pulled back to length, then kept out of the ground
        const flail = crashT < 3.5, t = time + s*h;
        // arms and legs windmilling while it flies, for comic effect: each end steered round its own circle about
        // the chest, and whatever that gives the limbs taken back off the whole body, so the flailing only ever
        // moves the arms and legs, never carries the rider anywhere. Only up in the air, and only a limb clear
        // of the ground: a foot paddling the dirt would run the body off up the hill
        const C = P[RAG_I.chest];
        if (flail && C.y - (C.g ?? -1e9) > .7)
        {
            const k = 1 - damp(10, h);
            let sx = 0, sy = 0;
            for (const i of LIMB_ENDS)
            {
                const p = P[i];
                if (p.hit) continue;
                const a = t*(i < RAG_I.ftL ? 14 : 10) + p.phase, w = i < RAG_I.ftL ? 6 : 4.5;
                const dx = (C.vx - sin(a)*w - p.vx)*k, dy = (C.vy + cos(a)*w - p.vy)*k;
                p.vx += dx; p.vy += dy; sx += dx; sy += dy;
            }
            for (const p of P) { p.vx -= sx/P.length; p.vy -= sy/P.length; }
        }
        // down and hurt: a hand comes up and waves feebly, the legs kick slowly, the head lifts and drops back,
        // steered like the flailing, with what it gives the limbs taken back off the body
        if (state == 'crash' && crashT > 2)
        {
            const H = P[RAG_I.hip], k = 1 - damp(5, h), u = clamp01((crashT - 2)*1.5), w = t*1.1;
            const goal = [[RAG_I.hdR, C.x + sin(t*4)*.35, C.y + .75 + .12*sin(t*2.3), C.z + .2],
                [RAG_I.ftL, H.x + .45 + cos(w*2.3)*.3, H.y + .35 + .25*sin(w*2.3), H.z + .15],
                [RAG_I.ftR, H.x + .45 + cos(w*2.3 + 2)*.3, H.y + .35 + .25*sin(w*2.3 + 2), H.z - .15],
                [RAG_I.head, C.x + .1, C.y + .25 + .22*max(0, sin(t*.9)), C.z]];
            let sx = 0, sy = 0, sz = 0;
            for (const [i, gx, gy, gz] of goal)
            {
                const p = P[i], dx = ((gx - p.x)*4 - p.vx)*k*u, dy = ((gy - p.y)*4 - p.vy)*k*u, dz = ((gz - p.z)*4 - p.vz)*k*u;
                p.vx += dx; p.vy += dy; p.vz += dz; sx += dx; sy += dy; sz += dz;
            }
            for (const p of P) { p.vx -= sx/P.length; p.vy -= sy/P.length; p.vz -= sz/P.length; }
        }
        for (const p of P)
        {
            p.ox = p.x; p.oy = p.y; p.oz = p.z;
            p.vy -= G_AIR*h;
            p.fall = p.vy;
            p.x += p.vx*h; p.y += p.vy*h; p.z += p.vz*h;
            p.g = terrainAt(p.x, p.z) + p.r; p.hit = false;
        }
        // the bones and the ground worked out together, so neither drags the other through
        for (let it = 0; it < 5; ++it)
        {
            RAG_BONES.forEach(([a, b], j)=>
            {
                const A = P[a], B = P[b], dx = B.x - A.x, dy = B.y - A.y, dz = B.z - A.z, d = hypot(dx, dy, dz) || 1e-6, f = (d - ragdoll.len[j])/d*.5;
                A.x += dx*f; A.y += dy*f; A.z += dz*f; B.x -= dx*f; B.y -= dy*f; B.z -= dz*f;
            });
            for (const p of P) if (p.y < p.g) { p.y = p.g; p.hit = true; }
            if (titleWreck) for (const p of P) offLogo(p, false);
        }
        for (const p of P)
        {
            p.vx = (p.x - p.ox)/h; p.vy = (p.y - p.oy)/h; p.vz = (p.z - p.oz)/h;
            // being pushed out of the ground (onto a rock, up a bank) is not a throw: a contact only bounces
            // back a little of the speed it hit with, and nothing is ever flung up faster than a tumble goes
            if (p.hit)
            {
                if (p.fall < 0) wreckSound('thud', -p.fall);
                p.vy = min(p.vy, max(0, -p.fall)*.3 + 1);
                // on the menu the heap stays at the foot of the logo rather than rolling off down the hillside
                const f = 1 - damp(titleWreck ? 45 : 9, h);
                p.vx *= f; p.vz *= f;
            }
            p.vy = min(p.vy, 8);
            const sp = hypot(p.vx, p.vy, p.vz);
            if (sp > 30) { p.vx *= 30/sp; p.vy *= 30/sp; p.vz *= 30/sp; }
        }
        // the pieces of the bike: tumbling, bouncing, and the wheels rolling on down the slope
        for (const p of pieces)
        {
            p.vy -= G_AIR*h;
            p.x += p.vx*h; p.y += p.vy*h; p.z += p.vz*h;
            if (titleWreck) offLogo(p, true);
            if (p.wheel && crashT > p.tipAt) p.w.x += 2.5*h*(p.key == 'rw' ? 1 : -1);
            p.R = Matrix4.rotation(vec3(p.w.x*h, p.w.y*h, p.w.z*h)).multiply(p.R);
            const g = terrainAt(p.x, p.z) + p.r;
            if (p.y < g)
            {
                p.y = g;
                if (p.vy < 0) { wreckSound(p.wheel ? 'thud' : 'clank', -p.vy); p.vy *= -.35; }
                if (p.wheel && crashT < p.tipAt + .6)
                {
                    // a wheel on its rim rolls on down the mountain, slowing only a little
                    const slope = terrainAt(p.x + .5, p.z) - terrainAt(p.x - .5, p.z);
                    p.vx -= G_AIR*sin(atan(slope))*.7*h;
                    p.vx *= 1 - damp(.25, h); p.vz *= 1 - damp(2, h);
                    p.w = vec3(p.w.x*(1 - damp(4, h)), p.w.y*(1 - damp(4, h)), -p.vx/p.r);
                }
                else
                {
                    const f = 1 - damp(titleWreck ? 14 : 2.5, h);
                    p.vx *= f; p.vz *= f; p.w = p.w.scale(1 - damp(3, h));
                }
            }
        }
    }
    const hip = P[RAG_I.hip];
    rag.x = hip.x; rag.y = hip.y; rag.z = hip.z;
}
// a piece of the bike where it is now, turning about its own middle
const pieceMatrix = p=> Matrix4.translation(vec3(p.x - OX, p.y - OY, p.z)).multiply(p.R).multiply(Matrix4.translation(p.c.scale(-1)));
function drawRagdoll()
{
    MC = new Matrix4;
    const P = ragdoll.pts.map(p=> vec3(p.x - OX, p.y - OY, p.z)), q = n=> P[RAG_I[n]], k = RS;
    // which way the rider faces: up the back and across the shoulders
    const up = q('head').subtract(q('hip')).normalize(), fwd = up.cross(q('shL').subtract(q('shR'))).normalize();
    tube(q('hip'), q('chest'), .31*k, PAL.jersey);
    ball(q('chest'), .35*k, PAL.jersey);
    tube(q('chest').add(fwd.scale(-.14*k)), q('chest').lerp(q('hip'), .6).add(fwd.scale(-.14*k)), .16*k, PAL.pack);
    ball(q('hip'), .31*k, PAL.pants);
    tube(q('chest'), q('head'), .11*k, PAL.black);
    // the helmet, turned the way the body faces
    const z = fwd.scale(-1), x = up.cross(z).normalize(), y = z.cross(x);
    const h = q('head');
    helmetHead(new Matrix4([x.x, x.y, x.z, 0, y.x, y.y, y.z, 0, z.x, z.y, z.z, 0, h.x, h.y, h.z, 1]).multiply(Matrix4.scaling(vec3(k))));
    for (const s of ['L', 'R'])
    {
        const sh = q('sh' + s), el = q('el' + s), hd = q('hd' + s), hp = q('hp' + s), kn = q('kn' + s), ft = q('ft' + s);
        ball(sh, .16*k, PAL.jersey2);
        tube(sh, el, .12*k, PAL.jersey2); ball(el, .11*k, PAL.jersey);
        tube(el, hd, .1*k, PAL.jersey); ball(hd, .1*k, PAL.glove);
        tube(hp, kn, .17*k, PAL.pants); ball(kn, .17*k, PAL.pad);
        tube(kn, ft, .13*k, PAL.pants); ball(ft, .14*k, PAL.shoe);
    }
}

// the transform the parts are drawn under, and its scratch space
let MC = new Matrix4;
const scratch = new Matrix4;
function drawPart(mesh, local, color)
{
    render3D.drawMesh(mesh, MC.copy().multiply(local), undefined, color);
}
function tube(a, b, dia, color)
{
    const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z, len = hypot(dx, dy, dz);
    if (len < 1e-4) return;
    const rot = vec3(acos(clampV(dy/len, -1, 1)), atan2(dx, dz), 0);
    drawPart(meshTube, buildMatrix(vec3((a.x + b.x)/2, (a.y + b.y)/2, (a.z + b.z)/2), rot, vec3(dia, len, dia), scratch), color);
}
function ball(p, dia, color) { drawPart(meshBall, buildMatrix(p, undefined, vec3(dia), scratch), color); }

// a full-face downhill helmet in its own space (forward -z, up +y), drawn under H: the shell and its red band, the
// chin bar with its vent, the peak, and the goggles on their strap
function helmetHead(H)
{
    const keep = MC;
    MC = keep.copy().multiply(H);

    box(vec3(0, -.1, -.2), vec3(.11, .045, .02), PAL.black);
    box(vec3(0, .035, 0), vec3(.37, .04, .365), PAL.black);

    box(vec3(0, .03, -.193), vec3(.25, .06, .02), PAL.lens);
    box(vec3(0, .054, -.195), vec3(.25, .016, .02), PAL.lens2);
    box(vec3(0, .15, -.13), vec3(.29, .025, .18), PAL.helmet2, vec3(.25, 0, 0));
    MC = keep;
}
function box(p, size, color, rot) { drawPart(meshBox, buildMatrix(p, rot, size, scratch), color); }

// two bone reach, the middle joint pushed toward the hint
function ik(a, c, l1, l2, hint)
{
    const d = c.subtract(a);
    let len = d.length();
    const reach = l1 + l2 - .001;
    if (len > reach) len = reach;
    const dir = d.normalize();
    const along = (l1*l1 - l2*l2 + len*len)/(2*len), h = sqrt(max(0, l1*l1 - along*along));
    let perp = hint.subtract(dir.scale(hint.dot(dir)));
    perp = perp.lengthSquared() > 1e-8 ? perp.normalize() : vec3(0, 0, -1);
    return a.add(dir.scale(along)).add(perp.scale(h));
}

// bike geometry in its own space: forward is -Z, ground contact at y=0
const RW = .37, AXLE_R = vec3(0, RW, .62), AXLE_F = vec3(0, RW, -.64), STEERER = vec3(0, .9, -.44);
// turned about the steerer: the frame in a tailwhip, the bars in a barspin
const aboutSteerer = (M, a)=> a ? M.copy().multiply(buildMatrix(STEERER, vec3(0, a, 0))).multiply(Matrix4.translation(STEERER.scale(-1))) : M;
// (G, when the bike is in pieces, gives each piece its own transform: wheels, frame, seat, fork, bars, cranks)
function drawBike(M, cF, cR, wheelSpin, crankA, whip=0, barA=0, offF=0, offR=0, G)
{
    // the frame and back wheel, the fork and front wheel, and the bars each have their own transform
    const MF = aboutSteerer(M, whip), MB = aboutSteerer(M, barA);
    MC = MF;
    // frame points drop with the suspension, the axles stay on the ground
    const sag = (p)=> vec3(p.x, p.y - mix(cR, cF, clamp01((.62 - p.z)/1.26)), p.z);
    const bb = sag(vec3(0, .34, .05)), headTop = sag(vec3(0, 1.0, -.41)), headBot = sag(vec3(0, .8, -.46));
    const seatTop = sag(vec3(0, .93 - (bike.seatDrop || 0), .17)), stayTop = sag(vec3(0, .8, .13)), ttRear = sag(vec3(0, .86, .14));
    // the axles ride up and down over the bumps, the fork and the swingarm with them
    const rA = AXLE_R.add(vec3(0, offR/RS, 0)), fA = AXLE_F.add(vec3(0, offF/RS, 0));
    // wheels
    for (const [axle, disc] of [[rA, .07], [fA, -.07]])
    {
        MC = axle == fA ? G?.fw ?? M : G?.rw ?? MF;
        const rot = vec3(wheelSpin, 0, PI/2);
        drawPart(meshTyre, buildMatrix(axle, rot, undefined, scratch));
        drawPart(meshRim, buildMatrix(axle, rot, undefined, scratch));
        drawPart(meshSpokes, buildMatrix(axle, vec3(wheelSpin, 0, 0), undefined, scratch));
        drawPart(meshDisc, buildMatrix(vec3(disc, axle.y, axle.z), vec3(wheelSpin, 0, PI/2), undefined, scratch));
        ball(axle, .09, PAL.silver);
    }
    MC = G?.frame ?? MF;
    // main frame, chunky downhill tubes (thinner on a dirt jumper, fatter on the sled)
    const tk = bike.tube;
    tube(bb, headBot, .085*tk, PAL.frame);
    tube(ttRear, headTop.add(vec3(0, -.05, .02)), .06*tk, PAL.frame);
    tube(bb, seatTop, .055*tk, PAL.frame);
    // the brace from the top tube down to the down tube, and a decal along the top tube
    if (bike.brace) tube(headTop.lerp(ttRear, .45), bb.lerp(headBot, .56), .05*tk, PAL.frame);
    if (bike.skid) box(bb.add(vec3(0, -.13, -.06)), vec3(.1, .03, .22), PAL.black);
    for (const x of [-.033, .033]) tube(ttRear.lerp(headTop, .3).add(vec3(x, -.005, 0)), ttRear.lerp(headTop, .72).add(vec3(x, -.025, 0)), .016, PAL.decal);
    tube(headBot.add(vec3(0, -.05, -.02)), headTop.add(vec3(0, .03, .01)), .075, PAL.frameDark);
    for (const x of [-.055, .055])
    {
        tube(bb.add(vec3(x, 0, 0)), rA.add(vec3(x*1.3, 0, 0)), .04, PAL.frame);
        tube(stayTop.add(vec3(x*.7, 0, 0)), rA.add(vec3(x*1.3, 0, 0)), .035, PAL.frame);
    }
    // eBike: a battery along the down tube, the motor round the cranks, a display on the bars
    const bA = bb.lerp(headBot, .16), bB = bb.lerp(headBot, .8);
    tube(bA, bB, bike.batt, PAL.frame);
    const lit = turboT > 0 ? hsl(.5, 1, .6 + .15*sin(time*40)) : battery >= 1 ? hsl(.5, 1, .55 + .15*sin(time*8)) : hsl(.5, .8, .18 + battery*.3);
    for (const x of [-1, 1]) tube(bA.lerp(bB, .1).add(vec3(x*(bike.batt/2 - .003), .005, 0)), bA.lerp(bB, .1 + .8*max(.06, battery)).add(vec3(x*(bike.batt/2 - .003), .005, 0)), .028, lit);
    ball(bb.add(vec3(0, -.01, .03)), bike.motor, PAL.motor);
    // rear shock: a coil with its piggyback reservoir, or an air can; none on a hardtail
    const shA = sag(vec3(0, .5, -.1)), shB = stayTop.add(vec3(0, -.02, -.04));
    if (bike.shock) tube(shA, shB, .045, PAL.frameDark);
    if (bike.shock == 'coil')
    {
        tube(shA.lerp(shB, .2), shA.lerp(shB, .75), .085, PAL.spring);
        tube(shA.lerp(shB, .55).add(vec3(.055, 0, .02)), shA.lerp(shB, .95).add(vec3(.055, 0, .02)), .04, PAL.gold);
    }
    else if (bike.shock == 'air')
    {
        tube(shA.lerp(shB, .3), shA.lerp(shB, .85), .075, PAL.black);
        tube(shA.lerp(shB, .32), shA.lerp(shB, .4), .08, PAL.spring);
    }
    // the drivetrain: chain from the ring to the cassette and back under through the mech, a guide over the ring,
    // and the calliper on the back rotor
    const ring = bb.add(vec3(.075, 0, 0)), cog = rA.add(vec3(.075, 0, 0)), mech = rA.add(vec3(.08, -.12, .02));
    tube(ring.add(vec3(0, .105, 0)), cog.add(vec3(0, .05, 0)), .012, PAL.chain);
    tube(ring.add(vec3(0, -.105, 0)), mech.add(vec3(0, -.02, -.02)), .012, PAL.chain);
    tube(mech, cog.add(vec3(0, -.04, 0)), .012, PAL.chain);
    drawPart(meshDisc, buildMatrix(cog, vec3(0, 0, PI/2), vec3(.55, 3, .55), scratch), PAL.chain);
    box(mech, vec3(.03, .1, .05), PAL.black);
    box(ring.add(vec3(0, .12, -.03)), vec3(.03, .05, .08), PAL.black);
    box(rA.add(vec3(.08, .1, -.06)), vec3(.03, .05, .07), PAL.black);
    // seat
    MC = G?.seat ?? MF;
    tube(seatTop, seatTop.add(vec3(0, .07, .03)), .035, PAL.silver);
    box(seatTop.add(vec3(0, .09, .05)), vec3(.13, .05, .27), PAL.black);
    box(seatTop.add(vec3(0, .116, .05)), vec3(.03, .006, .24), PAL.jersey2);
    // the fork: a dual crown up past the head tube, or a single crown under it; the stanchions slide into the lowers
    MC = G?.fork ?? M;
    const forkDir = fA.subtract(vec3(0, .8, -.46)).normalize();
    for (const x of [-.075, .075])
    {
        const top = (bike.crowns == 2 ? headTop.add(vec3(0, .02, 0)) : headBot.add(vec3(0, -.02, 0))).add(vec3(x, 0, 0)), stanEnd = headBot.add(forkDir.scale(.34)).add(vec3(x, 0, 0));
        tube(top, stanEnd, .042, PAL.gold);
        tube(fA.add(vec3(x, 0, 0)), fA.add(vec3(x, 0, 0)).subtract(forkDir.scale(.4)), .06, PAL.black);
    }
    if (bike.crowns == 2) box(headTop.add(vec3(0, .02, 0)), vec3(.23, .045, .07), PAL.black);
    box(headBot.add(vec3(0, -.02, 0)), vec3(.23, .045, .07), PAL.black);
    box(fA.add(vec3(-.08, .1, .05)), vec3(.03, .05, .07), PAL.black);
    // stem and wide bars
    MC = G?.bars ?? MB;
    const stem = headTop.add(vec3(0, .04, -.05)), bar = stem.add(vec3(0, .04, 0));
    tube(headTop, stem, .045, PAL.black);
    box(stem.add(vec3(0, .07, .02)), vec3(.09, .05, .07), lit);
    tube(bar.add(vec3(-.4, .03, 0)), bar.add(vec3(.4, .03, 0)), .032, PAL.black);
    for (const x of [-.36, .36]) tube(bar.add(vec3(x - .04, .03, 0)), bar.add(vec3(x + .04, .03, 0)), .045, PAL.glove);
    // cranks, chainring and pedals
    MC = G?.crank ?? MF;
    drawPart(meshRing, buildMatrix(bb.add(vec3(.07, 0, 0)), vec3(crankA, 0, PI/2), undefined, scratch));
    const pedals = [];
    for (const [x, a] of [[.17, crankA], [-.17, crankA + PI]])
    {
        const p = bb.add(vec3(x, .17*cos(a), -.17*sin(a)));
        tube(bb.add(vec3(x*.5, 0, 0)), p, .03, PAL.silver);
        box(p.add(vec3(x*.15, 0, 0)), vec3(.1, .025, .1), PAL.black);
        pedals.push(p.add(vec3(x*.12, .04, 0)));
    }
    return {pedals, grips: [bar.add(vec3(.37, .03, 0)), bar.add(vec3(-.37, .03, 0))], bb, seatTop};
}

// pose blends: 0 riding, the style tricks pull limbs away from the bike
function drawRider(M, bikePts, comp, styleName, styleAmt)
{
    MC = M;
    const down = vec3(0, -comp*.28, comp*.05);
    let hip = vec3(0, 1.16, .3).add(down), chest = vec3(0, 1.49, -.1).add(down.scale(.8));
    let head = vec3(0, 1.78, -.21).add(down.scale(.7));
    let feet = [bikePts.pedals[0], bikePts.pedals[1]], hands = [bikePts.grips[0], bikePts.grips[1]];
    const s = styleAmt;
    if (styleName == 'SUPERMAN')
    {
        hip = hip.lerp(vec3(0, 1.35, .55), s); chest = chest.lerp(vec3(0, 1.42, .05), s); head = head.lerp(vec3(0, 1.6, -.2), s);
        feet = feet.map((f, i)=> f.lerp(vec3(i ? -.12 : .12, 1.3, 1.25), s));
    }
    else if (styleName == 'NO-HANDER')
    {
        hands = hands.map((h, i)=> h.lerp(vec3(i ? -.78 : .78, 1.55, -.05), s));
        chest = chest.lerp(vec3(0, 1.58, .02), s); head = head.lerp(vec3(0, 1.88, -.05), s);
    }
    else if (styleName == 'CAN-CAN')
        feet[1] = feet[1].lerp(vec3(.62, .8, -.2), s);
    else if (styleName == 'HEEL CLICKER')
    {
        hip = hip.lerp(vec3(0, 1.3, .48), s);
        feet = feet.map((f, i)=> f.lerp(vec3(i ? -.06 : .06, 1.05, -.85), s));
    }
    // the feet come off the pedals and wait, spread, for the frame to come round
    else if (styleName == 'TAILWHIP')
    {
        hip = hip.lerp(vec3(0, 1.3, .25), s);
        feet = feet.map((f, i)=> f.lerp(vec3(i ? -.34 : .34, .78, .12), s));
    }
    // the hands let go above the bars while they spin, and catch them again
    else if (styleName == 'BARSPIN')
        hands = hands.map((h, i)=> h.lerp(vec3(i ? -.3 : .3, 1.3, -.32), s));
    const shoulders = [chest.add(vec3(.2, .03, -.02)), chest.add(vec3(-.2, .03, -.02))];
    const hips = [hip.add(vec3(.11, 0, 0)), hip.add(vec3(-.11, 0, 0))];
    // a downhill racer: black jersey with a red chest panel, red shoulders and sleeves and white cuffs, a hydration
    // pack, grey pants over knee pads, flat shoes, red gloves, and a full-face helmet
