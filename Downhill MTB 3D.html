// side on: the bike faces +x, pitch turns it in the screen's plane, roll tumbles it in a crash
let airBlend = 0, pz = 0, yawV = 0, leanV = 0, bermY = 0;
function sideMatrix(x, y, a, roll, piv, z=0, yaw=0, lean=0)
{
    // placed on the bent world and turned along the trail's weave
    const M = Matrix4.translation(vec3(x - OX, y - OY + piv, wz(x, z)));
    yaw -= atan(wzD(x, z));
    // turned off along a branch, and leaned over into a berm
    if (yaw) M.multiply(Matrix4.rotation(vec3(0, yaw, 0)));
    if (lean) M.multiply(Matrix4.rotation(vec3(lean, 0, 0)));
    M.multiply(Matrix4.rotation(vec3(a, -PI/2, roll)));
    M.multiply(Matrix4.translation(vec3(0, -piv, 0)));
    M.multiply(Matrix4.scaling(vec3(RS)));
    return M;
}
function bikeMatrix()
{
    // flips turn about the middle of rider and bike, on the ground it pivots on the wheels
    const piv = .85*RS*airBlend, onSomething = grounded || grinding, t = trickAnim();
    const M = sideMatrix(px, (onSomething ? baseY : py) + bermY, onSomething ? ang + landVis : ang, 0, piv, pz, yawV + t.spin, leanV);
    if (t.table) M.multiply(buildMatrix(vec3(0, .8, 0), vec3(0, 0, t.table))).multiply(Matrix4.translation(vec3(0, -.8, 0)));
    return M;
}
// the trick under way: its pose and how far round its spins are
const TA = {};
function trickAnim()
{
    const name = state == 'ride' && style ? style.name : '', p = name ? clamp01(styleT/style.dur) : 0, turn = TAU*sstep(p);
    TA.name = name; TA.amt = name ? sin(PI*p) : 0;
    TA.whip = name == 'TAILWHIP' ? turn : 0;
    TA.bar = name == 'BARSPIN' ? turn : 0;
    TA.spin = name == '360' ? turn : 0;
    TA.table = name == 'TABLETOP' ? -1.15*sstep(TA.amt*1.6) : 0;
    return TA;
}

class RiderView extends EngineObject3D

// the turbo: a cyan glow trailing the bike while it lasts
class TurboGlow extends EngineObject3D
{
    constructor() { super(vec3()); this.transparent = true; this.additive = true; this.castShadow = false; }
    render3D()
    {
        if (turboT <= 0 || state != 'ride') return;
        const M = bikeMatrix(), a = clamp01(turboT*2)*(.75 + .25*sin(time*37));
        for (let k = 0; k < 6; ++k)
        {
            const p = M.transformPoint(vec3(0, .45 + k*.04, .7 + k*.55));
            render3D.drawSoftDisc(p, 2.2 - k*.22, hsl(.5, 1, .6, a*(.5 - k*.07)));

    }
}

// ---------- the menu's little show: the rider rolls off the summit, smacks into the logo and goes flying, and the
// cow moos. A tap on the scene runs it again; the ride itself starts from the rider put back on the summit
let titleT = 0, titleWreck = false, menu = 'main', titleCamW = 1;
const wrecked = ()=> state == 'crash' || state == 'results' || state == 'title' && titleWreck;
function titleStep(dt)
{
    titleT += dt;
    logoWobV += (-55*logoWob - 3.2*logoWobV)*dt; logoWob += logoWobV*dt;
    if (menu == 'garage') { if (titleWreck || px != START_X) resetTitleRider(); titleT = 0; py = groundY(px); return; }
    if (titleWreck) { crashT += dt; stepWreck(dt); return; }
    vy = 0;
    if (titleT < .8) { py = groundY(px); vx = sp = 0; return; }
    sp = min(9.5, sp + 6.5*dt); px += sp*dt; py = groundY(px); vx = sp;
    ang = atan(groundSlope(px));
    if (px + .85 >= LOGO_X) smack();
}
function smack()
{

    moo();
    logoWobV += 1.1;
    camShake = max(camShake, .6);

function resetTitleRider()
{

}
function titleReplay()
{
    if (titleWreck && crashT < 1.2) return;
    if (titleWreck) resetTitleRider();
    titleT = max(titleT, .5);
}

function startRide()
{
    if (state == 'results') { newRun(nextSeed()); }
    // off the menu: the rider back on the summit and the logo toppled over
    if (state == 'title') { resetTitleRider(); startLogoFall(); menu = 'main'; }
    state = 'ride';
    sp = 6;
    hintT = 0;
    sfx('go');
    showMessage('DROP IN!', BIOME_NAMES[biomeOf(0)], hsl(.13,.95,.6));
    zoneNow = 0;
}
let zoneNow = 0;

// the bests are kept the moment the run ends, so none is lost however long the rider lies there
function saveBest()
{
    isBest = dist > best.dist || score > best.score || bestCombo > (best.combo || 0);
    best.dist = max(best.dist, floor(dist)); best.score = max(best.score, score); best.combo = max(best.combo || 0, bestCombo);
    try { localStorage.setItem('dhside.best', JSON.stringify(best)); } catch(e) {}
}
function endRun()
{
    state = 'results'; resultsT = 0;
}
const GROANS = ['OUCH...', "I'M OK!", 'WHO MOVED THE GROUND?', 'THAT WILL BRUISE', 'MY BIKE!', 'FIVE MORE MINUTES', 'SEEING STARS'];
let groanAt = 2;

function gameUpdate()
{
    const dt = timeDelta;
    readInput(dt);
    if (window.__autopilot && state == 'ride') autopilotInput();
    updateMessages(dt);
    if (state == 'ride')
    {
        // the ride in steps of no more than a 60th of a second, so a slow frame never lets the bike skip past a rock
        const n = max(1, ceil(dt*60 - .01));
        for (let k = 0; k < n && state == 'ride'; ++k) rideStep(dt/n);
    }
    else if (state == 'crash' || state == 'results')
    {
        crashT += dt;
        stepWreck(dt);
        // the rider lies there groaning until a tap brings up the score card
        if (state == 'crash' && crashT > groanAt) { groanAt += 4.2 + Math.random()*1.5; moo(1.3, .55, .22); showMessage(GROANS[floor(Math.random()*GROANS.length)], '', hsl(.6,.4,.85)); }
        if (state == 'results') resultsT += dt;
    }
    else titleStep(dt);
    if (logoFall > 0) stepLogoFall(dt);
    updateVisuals(dt);
    trackEnsure(px + TRACK_AHEAD);
    if (frame % 60 == 0) trackPrune(px - 260);
    updateEffects(dt);
    audioUpdate(dt);
}
function rideStep(dt)
{
    runTime += dt; hintT += dt;
    topSpeed = max(topSpeed, hypot(vx, vy));
    // the brakes: their grip runs down while they are on, and a long enough slide scores when it ends
    if (brakeOn()) brakeFuel = max(0, brakeFuel - dt);
    else if (slideT > 0) { if (slideT > .6) { addTrick('POWER SLIDE', min(500, round(slideT*90/10)*10)); ++slides; } slideT = 0; }
    offGroundT = grounded || grinding ? 0 : offGroundT + dt;
    if (jumpQueued) jumpBuf = .15;
    jumpQueued = false;
    if (jumpBuf > 0 && (grounded || grinding || offGroundT < .14)) jumpNow();
    else if (jumpBuf > 0) jumpBuf -= dt;
    if (trickBuf > 0 && (grounded || grinding)) trickBuf -= dt;
    if (!grounded && !grinding) airControl(dt);
    const pxWas = px;
    for (let k = 0; k < SUB && state == 'ride'; ++k)
        grinding ? stepGrind(dt/SUB) : grounded ? stepGround(dt/SUB) : stepAir(dt/SUB);
    if (state != 'ride') return;
    updateFork(pxWas);
    updateFeatures(dt, pxWas);
    checkRocks();
    collectOrbs();
    if (turboGrace > 0) turboGrace -= dt;
    if (turboT > 0 && !paceAt(px))
    {
        turboT -= dt;
        battery = max(0, turboT/(superOn ? SUPER_LEN : TURBO_LEN*bike.turbo));
        if (turboT <= 0) { battery = 0; turboGrace = 1.5; superOn = false; showMessage('BATTERY EMPTY', 'tricks and sprockets recharge it', hsl(.5,.6,.75)); }
    }
    if (legT > 0) legT -= dt;
    if (setShownT > 0) setShownT -= dt;
    // a set ridden past with some of it left is lost
    if (setShown && !setShown.done && !setShown.lost && px > setShown.x1 + 3) { setShown.lost = true; setShownT = 1.2; }
    if (grounded && combo && (comboT -= dt) <= 0) bankCombo();
    if (boostT > 0) boostT -= dt;
    dist = max(dist, px - START_X);
    // a new stretch of mountain
    const z = zoneAt(px - 40);
    if (z != zoneNow) { zoneNow = z; showMessage(BIOME_NAMES[biomeOf(z)], 'next stretch', hsl(.55,.6,.8)); }
}

// the ground smoothed over a couple of metres, for the body of the bike to ride: the fine bumps and the corners
// between the points of the ground are ironed out, but it never strays more than a few centimetres from the real
// ground, so a lip or a drop just ahead pulls it down by no more than that
const SMOOTH_W = [1, 2, 3, 4, 5, 4, 3, 2, 1].map(w=> w/25);
function rideYs(x)
{
    const y = rideY(x);
    let s = 0;
    for (let k = 0; k < 9; ++k) s += rideY(x + (k - 4)*.25)*SMOOTH_W[k];
    return y + clampV(s - y, -.06, .06);
}
let wheelOffF = 0, wheelOffR = 0, visYWas = 0, visVyWas = 0;
function updateVisuals(dt)
{
    let offF = 0, offR = 0;
    if (grounded || grinding)
    {
        // the bike sits on both wheels, pitched by the ground between them
        const c = cos(ang)*RS;
        if (grinding) { baseY = py; ang = atan(grinding.slope); }
        else
        {
            // the body rides the smoothed ground, pitched by it under the wheels, but never toward a lip's drop the
            // front wheel is already over
            const xr = px - .62*c, xf = px + .64*c, yc = rideYs(px), yr = rideYs(xr), yf = rideYs(xf);
            const sR = (yc - yr)/max(.1, px - xr), sF = (yf - yc)/max(.1, xf - px);
            const target = atan(sF < sR - .5 ? sR : (sR + sF)/2);
            ang += wrapPI(target - ang)*damp(28, dt);
            baseY = yc;
            // the wheels follow the real ground, up and down on the suspension under the steady body
            const along = x=> baseY + (x - px)*tan(ang);
            offF = clampV(rideY(xf) - along(xf), -.2, .2); offR = clampV(rideY(xr) - along(xr), -.2, .2);
        }
        airBlend += (0 - airBlend)*damp(12, dt);
        wheelSpin -= sp*dt/(RW*RS)*(brakeOn() ? .2 : 1);
    }
    else
    {
        airBlend += (1 - airBlend)*damp(8, dt);
        wheelSpin -= .7*hypot(vx, vy)*dt/(RW*RS);
    }
    wheelOffF += (offF - wheelOffF)*damp(40, dt); wheelOffR += (offR - wheelOffR)*damp(40, dt);
    // the suspension, loaded by the body's own ups and downs, compressed when it lands and stretched out in the air
    const vis = grounded || grinding ? baseY : py, visVy = (vis - visYWas)/max(dt, 1e-4);
    const acc = grounded || grinding ? clampV((visVy - visVyWas)/max(dt, 1e-4), -40, 120) : -14;
    visYWas = vis; visVyWas = visVy;
    const sus = clampV(.035 + acc*.004, -.01, .16);
    suspFV += (240*(sus - suspF) - 17*suspFV)*dt; suspF = clampV(suspF + suspFV*dt, -.02, .19);
    suspRV += (240*(sus - suspR) - 17*suspRV)*dt; suspR = clampV(suspR + suspRV*dt, -.02, .19);
    landVis *= 1 - damp(10, dt);
    // on a branch: across to its line, turned along it, leaned into the berms and riding up their walls
    let tYaw = 0, tLean = 0, tY = 0;
    pz = 0;
    const bx = state == 'ride' || state == 'title' ? px : rag.x;
    if (ride && bx > ride.x0 && bx < ride.x1)
    {
        const m = bermAt(ride, bx), len = hypot(1, m.dz);
        pz = brZ(ride, bx);
        tYaw = -atan(m.dz)*1.3;
        tLean = clampV(atan(sp*sp*m.k/9.81)*.8, -.75, .75);
        if (grounded)
        {
            const up = 1.1*m.h/1.6;
            pz += m.o*up/len; tY = bermLift(up, m.h);
            tYaw -= tLean*.4;
        }
    }
    // and leaned into the weave's turns
    if (state == 'ride') tLean += clampV(atan(sp*sp*wzK(bx)*weaveK(pz)/9.81)*.8, -.55, .55)*(grounded ? 1 : .4);
    // locked up, the back wheel steps out
    if (brakeOn()) tYaw += .34*clamp01(sp/8);
    yawV += (tYaw - yawV)*damp(12, dt);
    leanV += (tLean - leanV)*damp(10, dt);
    bermY += (tY - bermY)*damp(16, dt);
    // pedal until the bike runs away, then stand and coast with the cranks level
    if (legT > 0 && grounded && !grinding && state == 'ride') crank += 18*dt;
    else if ((grounded && sp < 16 || state == 'title' && sp > .5) && !grinding)
        crank += clampV(sp*.95, 3, 11)*dt;
    else
    {
        const level = abs(wrapPI(crank - PI/2)) < PI/2 ? PI/2 : -PI/2;
        crank += wrapPI(level - crank)*damp(5, dt);
    }
    compressKick *= 1 - damp(4, dt);
    compress = clamp01((suspF + suspR)*2.6 + compressKick - .12 + (grinding && !grinding.deck ? .25 : 0));
}

const camViewName = ()=> camView[camPortrait() ? 'p' : 'l'];

function gameUpdatePost()
{
    const dt = timeDelta;
    const W = mainCanvasSize.x, H = mainCanvasSize.y, aspect = W/max(1, H), portrait = aspect < 1;
    const cam = render3D.camera, speed = state == 'ride' ? hypot(vx, vy) : 8;
    const vfov = portrait ? 1.0 : .78;
    cam.fov = vfov;
    // the chosen view's numbers, eased toward so a change of view glides
    // the summit is always framed three quarter on, and the camera glides into the chosen view on the drop in
    const v = state == 'title' ? CAM_VIEWS['3/4'] : CAM_VIEWS[camView[portrait ? 'p' : 'l']] || CAM_VIEWS['3/4'], o = portrait ? 0 : 1;
    const want = {yaw: v.yaw[o], pitch: v.pitch[o], lead: v.lead[o], up: v.up[o], dist: v.dist[o]*CAM_ZOOMS[camView[portrait ? 'zp' : 'zl']][1], follow: v.follow, fixed: (v.fixed?.length ? v.fixed[o] : v.fixed) ? 1 : 0};
    if (!camP) camP = {...want};
    for (const key in want) camP[key] += (want[key] - camP[key])*damp(3, dt);
    const fx = state == 'crash' || state == 'results' ? rag.x : px;
    const fy = state == 'crash' || state == 'results' ? rag.y : grounded || grinding ? baseY : py;
    // a drop-in: from rolling onto the ledge until just after the landing the camera comes in close, low and
    // round in front of the rider, so the drop and the tricks off it fill the screen, then eases back out
    const di = state == 'ride' || state == 'crash' ? feats.find(f=> (f.type == 'dropin' || f.type == 'canyon') && fx > (f.camX0 ?? f.x0) - 6 && fx < f.landX + 6 && onLine(f, fx)) : null;
    dropCam += ((di ? 1 : 0) - dropCam)*damp(di ? 1.6 : 1.1, dt);
    // a canyon gap is framed wider, to see across it
    if (di) dropDist = di.camDist ?? DROP_VIEW.dist[o];
    const C = dropCam < .001 ? camP : {};
    if (C != camP) for (const key in camP) C[key] = mix(camP[key], DROP_VIEW[key][o] ?? DROP_VIEW[key], dropCam);
    const wrecked = state == 'crash' || state == 'results';
    crashCam += ((wrecked ? 1 : 0) - crashCam)*damp(wrecked ? 2.2 : 4, dt);
    const Cw = crashCam < .001 ? C : {};
    if (Cw != C) for (const key in C) Cw[key] = mix(C[key], CRASH_VIEW[key][o] ?? CRASH_VIEW[key], crashCam);
    const close = max(dropCam, crashCam);
    // on a super send it looks at the rider rather than the landing far below, and stands back a little
    sendCam += ((state == 'ride' && superFlight ? 1 : 0) - sendCam)*damp(2, dt);
    airZoom += ((state == 'ride' && !grounded && !grinding && airT > .5 ? 1 : 0) - airZoom)*damp(1.5, dt);
    const hs = (portrait ? 12 : 30) + speed*(portrait ? .28 : .36) + airZoom*5 + sendCam*(portrait ? 3 : 8);
    const hf = 2*atan(tan(vfov/2)*aspect), fit = hs/(2*tan(hf/2));
    // a fixed view is set back by its own distance, the others far enough to fit the trail across the screen;
    // eased between the two through a change of view
    const D0 = mix(mix(fit*(Cw.fixed > .99 ? 1 : Cw.dist), (Cw.fixed < .01 ? 1 : Cw.dist) + speed*.3 + airZoom*4, Cw.fixed),
        dropDist + speed*.12, dropCam), D = mix(D0, CRASH_VIEW.dist[o], crashCam), vs = 2*D*tan(vfov/2);
    camD += (D - camD)*damp(2.5, dt);
    const lead = state == 'title' ? min(Cw.lead, .3) - .18 : Cw.lead*(1 - sendCam*.7), reach = mix(hs, D*1.1, Cw.fixed);
    // never so far ahead that the rider is pushed off the side of the screen: from a view at an angle the lead
    // runs partly across the screen, brings the rider nearer the camera than what it looks at (which makes it
    // look wider still) and the weave puts the trail ahead off to one side, and a tall screen is narrow.
    // Shortened until the rider is no more than 60% of the way to the edge
    const al0 = Cw.yaw + camB*Cw.follow, th = tan(hf/2), ca = cos(al0), sa = sin(al0), ce = cos(Cw.pitch);
    const rz0 = state == 'ride' ? wz(fx, pz) : state == 'title' ? wz(fx, 0) : rag.z;
    let ahead0 = reach*lead;
    for (let i = 0; i < 8; ++i)
    {
        const dz = rz0 - wz(fx + ahead0, camZ), depth = max(2, D - (ahead0*sa + dz*ca)*ce);
        if (abs(-ahead0*ca + dz*sa)/(depth*th) <= .6) break;
        ahead0 *= .8;
    }
    const tx = fx + ahead0;
    // close in on a drop it looks at the rider, not the ground ahead, and keeps up with the fall
    const ahead = 1 - max(close, sendCam*.8)*.85;
    const ty = fy - vs*Cw.up + ((camGround(fx + hs*.45) - fy)*.32*min(1, .6 + Cw.lead*.4) + (camGround(tx) - fy)*max(0, Cw.lead - .4)*.6)*ahead;
    camX += (tx - camX)*damp(state == 'title' ? 3 : 9, dt);
    camY += (ty - camY)*damp(mix(4.5, 10, close), dt);
    // keep the numbers small: move the world's origin along with the rider
    if (abs(px - OX) > 400 || abs(py - OY) > 200) rebase(px, py);
    camShake = max(0, camShake - dt*2.5);
    const k = camShake*.35, j = ()=> (Math.random() - .5)*k;
    // the camera moves in and out with the rider's line, so a branch stays in frame at the same size
    const behind = clamp01((Cw.yaw - .7)/.5);
    // the views from behind aim along the line itself: where it will be at the point they look at
    const lineZ = x=> ride && x > ride.x0 && x < ride.x1 ? brZ(ride, x) : 0;
    const zAim = state == 'ride' ? mix(pz, lineZ(camX), behind) : state == 'title' ? 0 : rag.z - weaveZ(rag.x);
    camZ += (zAim*mix(.9, 1, behind) - camZ)*damp(mix(3.5, 9, behind), dt);
    // a three quarter view: off to the side of the trail, back up it and above, looking down the mountain,
    // swinging round as the trail weaves so the rider stays side on
    const zW = wz(camX, camZ);
    // the way the rider's line runs: the weave, and a branch's own turn off and back
    const lineD = wzD(fx, camZ) + (ride && fx > ride.x0 && fx < ride.x1 ? brZ(ride, fx + .5) - brZ(ride, fx - .5) : 0);
    camB += (atan(lineD) - camB)*damp(mix(1.2, 3, behind), dt);
    const al = Cw.yaw + camB*Cw.follow, el = Cw.pitch;
    const cx = camX - sin(al)*cos(el)*camD, cz = zW + cos(al)*cos(el)*camD;
    // never down in the ground, neither the line behind the rider nor the hillside the camera is over
    let cy = max(camY + sin(el)*camD, camGround(cx) + 2.6, terrainAt(cx, cz) + 2);
    // and the rider always in sight: where the ground between rises into the view, the camera lifts to see over it,
    // quickly, and settles back down slowly once it is clear
    if (state != 'title')
    {
        // looking at the wheels, so the whole of bike and rider is in view, not just a head over a crest
        let need = sightLift(fx, fy + .35*RS, state == 'ride' ? wz(fx, pz) : rag.z, cx, cy, cz);
        // and where a flight will be a moment from now, so the camera is already up as the rider drops in behind an edge
        if (state == 'ride' && !grounded && !grinding)
        {

    let eye = vec3(cx - OX + j(), cy - OY + j(), cz), look = vec3(camX - OX, camY - OY, zW);

    titleCamW = state == 'title' ? min(1, titleCamW + dt*1.4) : max(0, titleCamW - dt/1.3);
    garageW += ((state == 'title' && menu == 'garage' ? 1 : 0) - garageW)*damp(3, dt);
    if (titleCamW > 0)
    {

        if (garageW > .001)
        {
            const [ge, gl] = garagePose(W, H, vfov), g = garageW*garageW*(3 - 2*garageW);
            te = te.lerp(ge, g); tl = tl.lerp(gl, g);

    cam.lookAt(look);

    updateChunks(camX, false, Cw.lead > .6 ? 140 : 0);
    updateRings(cam.pos, camY, camX);
    updateSky(dt);
    adaptQuality(dt);
}

// the menu's view: on to the logo from a little above and to one side, so its thickness shows and the trail runs
// across the screen for the rider to come in along, near enough to fill the band of the screen the menu leaves
// for it, and turning slowly to and fro
function titlePose(W, H, vf)
{
    const t = tan(vf/2), band = titleBand(W, H), lh = logoH() + .4;
    const d = max(lh*H/(2*t*(band[1] - band[0])*H), LOGO_W*1.1*H/(2*t*W)), wpp = 2*d*t/H;
    const b = logoBase(), c = vec3(b.x - OX, b.y - OY + LOGO_LIFT + logoH()/2, b.z);
    const look = c.add(vec3(0, -(H/2 - (band[0] + band[1])/2*H)*wpp, 0));
    const a = LOGO_YAW + .4 + sin(time*.21)*.06, el = .1;
    return [look.add(vec3(sin(a)*cos(el), sin(el), cos(a)*cos(el)).scale(d)), look];
}
// the garage's view: round the front of the rider standing at the start, turning slowly, framed above the panel
let garageW = 0;
function garagePose(W, H, vf)
{
    const t = tan(vf/2), band = W > H ? [.04, .5] : [.08, .5], c = bikeMatrix().transformPoint(vec3(0, .95, 0));
    const d = max(2.9*H/(2*t*(band[1] - band[0])*H), 3.4*H/(2*t*W*.85)), wpp = 2*d*t/H;
    const look = c.add(vec3(0, -(H/2 - (band[0] + band[1])/2*H)*wpp, 0));

// the part of the screen, top to bottom as fractions of its height, the logo is framed into
const titleBand = (W, H)=> W > H ? [.05, .6] : [.1, .52];

// ---------- the day passes: sunrise, day, sunset, night under the stars, and round again
const DAY = [
    [0,   [.22,.27,.52], [.98,.66,.5],  [.42,.34,.38], [1,.72,.5],   .9, .08],
    [.1,  [.28,.5,.85],  [.8,.87,.95],  [.46,.52,.5],  [1,.95,.85],  1,  .55],
    [.42, [.25,.48,.85], [.78,.88,.96], [.46,.52,.5],  [1,.97,.9],   1,  .7],
    [.55, [.3,.32,.6],   [1,.62,.38],   [.42,.3,.3],   [1,.6,.32],   .9, .14],
    [.63, [.1,.1,.28],   [.5,.32,.44],  [.18,.15,.22], [.65,.45,.6], .45, .02],
    [.71, [.02,.03,.1],  [.07,.1,.2],   [.04,.05,.09], [.5,.6,.95],  .45, .5],
    [.9,  [.02,.03,.1],  [.08,.1,.2],   [.04,.05,.09], [.5,.6,.95],  .45, .5],
    [.96, [.12,.12,.3],  [.55,.4,.5],   [.2,.18,.25],  [.8,.5,.45],  .5, .02],
    [1,   [.22,.27,.52], [.98,.66,.5],  [.42,.34,.38], [1,.72,.5],   .9, .08]];
const lerp3 = (a, b, t)=> [mix(a[0], b[0], t), mix(a[1], b[1], t), mix(a[2], b[2], t)];

function updateSky(dt)
{
    if (state == 'ride') dayT = (dayT + dt/DAY_LEN) % 1;
    if (state == 'ride' && runTime < NIGHT_AFTER) dayT = min(dayT, DUSK);
    let k = 0;
    while (k < DAY.length - 2 && DAY[k + 1][0] <= dayT) ++k;
    const a = DAY[k], b = DAY[k + 1], t = sstep((dayT - a[0])/(b[0] - a[0]));
    const top = lerp3(a[1], b[1], t), hor = lerp3(a[2], b[2], t), bot = lerp3(a[3], b[3], t), sun = lerp3(a[4], b[4], t);
    const bright = mix(a[5], b[5], t), height = mix(a[6], b[6], t);
    night = clamp01(1 - (top[0] + top[1] + top[2])/.35);
    // recolor the dome in place now and then: the day turns slowly enough that it never shows
    const sky = render3D.sky;
    if (sky && frame % 12 == 0)
    {
        if (sky.colors.length != sky.points.length) sky.colors = sky.points.map(()=> new Color);
        sky.points.forEach((p, i)=>
        {
            const c = sky.colors[i], to = p.y < 0 ? bot : top, t = abs(p.y);
            c.r = mix(hor[0], to[0], t); c.g = mix(hor[1], to[1], t); c.b = mix(hor[2], to[2], t); c.a = 1;
        });
        sky.dirty = true;
    }
    render3D.fogColor = col3(hor);
    // the sun crosses the sky by day, the moon by night
    const arc = night > .5 ? (dayT - .68)/.3 : dayT/.62;
    render3D.sunDirection = vec3(mix(-.8, .8, clamp01(arc)), max(.06, height), .55);
    render3D.sunColor = col3(sun).scale(bright, 1);
    render3D.ambientColor = new Color(top[0]*.5 + .07, top[1]*.5 + .07, top[2]*.5 + .1);
    render3D.ambientGroundColor = new Color(bot[0]*.5 + .04, bot[1]*.5 + .04, bot[2]*.5 + .05);
    if (flare) flare.intensity = .7*(1 - night)*clamp01(height*4);
    if (headlamp)
    {
        headlamp.intensity = night*1.6;
        const hx = cos(ang)*1.2;
        headlamp.pos3D = W3(px + hx, (grounded ? baseY : py) + 1.3, pz + 1.2);
    }
}

// ---------- sprockets and battery cells: a row along the trail, a set along a rail or a line, an arc over a jump,
// and now and then a row of blue cells on the run in to a mega booter
const orbSeen = (o, rz)=> !o.got && o.x > camX - 40 && o.x < camX + 70 && !(abs(rz) > 2 && abs((o.z || 0) - rz) > 4);

function collectOrbs()
{
    const cy = (grounded || grinding ? baseY : py) + .9*RS, rz = riderZ();
    for (const o of orbs)
    {
        if (o.got || abs(o.x - px) > 2.5 || abs((o.z || 0) - rz) > 2.4) continue;
        if ((o.x - px)**2 + (o.y - cy)**2 > (o.air ? 2.2 : 1.7)**2) continue;
        o.got = true; ++orbStreak;
        if (o.tyre)
        {
            ++tyresGot; score += 50;
            sfx('bonk');
            new ParticleEmitter3D(W3(o.x, o.y, o.z || 0), .8, .08, 200, PI, undefined,
                hsl(.07,1,.6), WHITE, hsl(.07,1,.6,0), CLEAR_WHITE, .5, .4, 0, .1, .92, -.002, .1, .4, true);
            if (++tyres >= 3)
            {
                tyres = 0; brakeFuel = BRAKE_LEN;
                showMessage('BRAKES READY!', 'hold BRAKE on the left to lock up and slide', hsl(.07,1,.62));
                sfx('ready');
            }
            else showTrick('SPARE TYRE ' + tyres + '/3', 50);
            continue;
        }
        o.cell ? ++cellsGot : ++orbsGot;
        score += o.cell ? 100 : o.air ? 50 : 20;
        charge(o.cell ? 400 : o.air ? 140 : 80);
        sfx(o.cell ? 'cell' : 'orb', min(orbStreak, 24));
        const hue = o.cell ? .52 : .12;
        new ParticleEmitter3D(W3(o.x, o.y, o.z || 0), .6, .08, o.cell ? 300 : 200, PI, undefined,
            hsl(hue,1,.62), WHITE, hsl(hue,1,.62,0), CLEAR_WHITE, .5, .4, 0, .1, .92, -.002, .1, .4, true);
        // the set it belongs to: shown filling up, and when the last one is picked up, its boost
        const set = o.set;
        if (!set) continue;
        ++set.got;
        if (set.kind == 'arc' || set.n < 5) continue;
        setShown = set; setShownT = 2;
        if (set.got == set.n && !set.done)
        {
            set.done = true; setShownT = 1.6;
            if (o.cell) { supercharge(); addTrick('FULL CHARGE', 600, undefined, true); }
            else { pedalPower(); addTrick('SPROCKET SET', set.n*40, undefined, true); }
        }
    }
}

// ---------- dust, snow spray, grind sparks, falling snow
function updateEffects(dt)
{
    const riding = state == 'ride';
    const snowy = surfNow == S_SNOW, bw = biomeW(camX, {});
    let rate = 0;
    // a berm throws up a big spray as the back wheel slides round
    const inBerm = ride && px > ride.x0 && px < ride.x1 && (px < ride.x0 + ride.T || px > ride.x1 - ride.T) || !ride && abs(bankAt(px)) > .15;
    if (riding && grounded)
        rate = (snowy ? 3.2 : 2)*sp + (landVis ? abs(landVis)*120 : 0) + (inBerm ? abs(leanV)*260 : 0) + (turboT > 0 ? 40 : 0) + (braking ? 160 : 0);
    dust.emitRate = min(rate, 320);
    if (snowy) { dust.colorStartA = hsl(.6,.15,.97,.75); dust.colorStartB = hsl(.6,.2,.9,.6); }
    else { dust.colorStartA = hsl(.08,.3,.55,.6); dust.colorStartB = hsl(.09,.25,.45,.5); }
    dust.colorEndA = dust.colorStartA.scale(1, 0); dust.colorEndB = dust.colorStartB.scale(1, 0);
    // thrown up and back off the rear wheel
    const head = -atan(wzD(px, pz)) + yawV;
    dust.pos3D = W3(px - .75*RS, py + .15 + bermY, pz + .2);
    dust.rotation3D = vec3(0, head, .9);
    sparks.emitRate = riding && grinding && !grinding.deck ? 90 : 0;
    sparks.pos3D = W3(px - .3, py + .05, .2);
    sparks.rotation3D = vec3(0, head, 1.1);
    zap.emitRate = riding && turboT > 0 ? 160 : 0;
    const wet = riding && grounded && !onBranch(px) && gullies.some(g=> !g.bridge && abs(px - g.xc) < 2.2);
    splashFx.emitRate = wet ? 40 + sp*14 : 0;
    splashFx.pos3D = W3(px, py + .2, pz);

let quality = 3, qualityT = 0, qualityLooks = 0;
function adaptQuality(dt)
{

    qualityT = 0; ++qualityLooks;

    quality = max(0, quality - (averageFPS < 28 ? 2 : 1));

// ---------- forks: the line picked with a swipe before the split is taken at it, and scored at the merge
function updateFork(pxWas)
{
    forkAhead = null;
    if (!ride)
    {
        for (const s of splits)
        {
            if (px > s.x0 - 80 && px < s.x0) forkAhead = s;
            if (pxWas < s.x0 && px >= s.x0)
            {
                const b = s.lines[laneWant];
                if (b) { ride = b; bermStage = 0; sfx('berm'); showMessage(LINES[b.kind].name, b.what.toLowerCase(), hsl(.13,.95,.6)); }
                laneWant = 0;
            }
        }
        return;
    }
    const b = ride;
    if (bermStage == 0 && px > b.x0 + b.T*.75) { bermStage = 1; if (grounded) addTrick('BERM', 120); }
    if (bermStage == 1 && px > b.x1 - b.T) { bermStage = 2; sfx('berm'); }
    if (bermStage == 2 && px > b.x1 - b.T*.25) { bermStage = 3; if (grounded) addTrick('BERM', 120); }
    if (px >= b.x1)
    {
        const L = LINES[b.kind];
        addTrick(L.name, L.pts);
        sfx('line');
        ++lines; if (b.kind == 'pro') ++proLines;
        linesRidden.add(b.kind);
        // every kind of line in one run
        if (linesRidden.size == 3 && !allLines) { allLines = true; addTrick('ALL LINES', 1000); }
        ride = null;
    }
}

// ---------- creeks, bridges and whoops as the rider meets them, and a word for the big set pieces as they come up
const FEAT_WORDS = {dropin: ['DROP-IN', 'tap at the lip to send it'], canyon: ['CANYON GAP', 'the trail sets your speed'],
    stairs: ['DROP STAIRS', 'drop off every ledge'], deck: ['DROP DECK', 'roll it out and drop off the end']};
function updateFeatures(dt, pxWas)
{
    const took = groundedWas && !grounded && !grinding;

    for (const f of feats)
    {
        if (!onLine(f, px)) continue;
        if (!f.warned && FEAT_WORDS[f.type] && px > (f.camX0 ?? f.x0) - 2 - (f.type == 'canyon' ? 0 : 6))
        {
            f.warned = true;
            showMessage(...FEAT_WORDS[f.type], hsl(.13,.95,.6));
        }
        if (f.x0 > px + 2 || (f.x2 ?? f.x1) < pxWas - 20) continue;
        if (f.type == 'creek' && !f.done && pxWas < f.g.xc && px >= f.g.xc)
        {
            // through the water it splashes and drags, over it scores
            f.done = true;
            if (!grounded && py > groundY(px) + .4) addTrick('CREEK GAP', 150);
            else { sp = max(VMIN, sp*.84); sfx('splash'); dustBurst(px, py, 30); camShake = max(camShake, .2); }
        }
        if (f.type == 'bridge')
        {
            if (px > f.x0 && px < f.x1 && grounded) f.on = (f.on || 0) + dt;
            if (!f.done && px > f.x1) { f.done = true; if (f.on > .4) addTrick('BRIDGE', 100); }
        }
        if (f.type == 'dropin' && !f.braked && px > f.x0) { f.braked = true; if (sp > f.v + 2) sfx('berm'); }
        if (f.type == 'berms')
        {
            // carved on the ground through each turn, or only just off it over a bump: points and a pump of speed out of it
            for (const a of f.apexes) if (pxWas < a && px >= a && (grounded || offGroundT < .3))
            {
                ++f.carved;
                addTrick('BERM', 120);
                sfx('berm');
                boostT = max(boostT, .45);
            }
            if (!f.done && px > f.x1) { f.done = true; if (f.carved == f.apexes.length) { addTrick('BERM RUN x' + f.carved, 100*f.carved); countTrick('BERM RUN'); } }
        }
        if (f.type == 'stairs')
        {
            if (took && px > f.x0 && px < f.x1 + 1) ++f.airs;
            if (!f.done && px > f.x1 + 4) { f.done = true; if (f.airs >= 3) { addTrick('DROP STAIRS x' + f.airs, 120*f.airs); countTrick('DROP STAIRS'); } }
        }
        if (f.type == 'whoops')
        {
            if (took && px > f.x0 && px < f.x1) ++f.airs;
            if (!f.done && px > f.x1 + 4) { f.done = true; if (f.airs >= 2) addTrick('RHYTHM x' + f.airs, 70*f.airs); }
        }
    }
}

function tapScreen(key=false)

    if (state == 'title') { if (key) startRide(); else if (menu == 'main') titleReplay(); return true; }

addEventListener('pointerdown', e=>
{

// a flick: this far across the screen, in css pixels, within this long. A finger can flick any time it is down,
// over and over while it holds a flip, each time it has slowed, paused or turned after the one before.
const SWIPE_PX = 28, SWIPE_MS = 220;
function strokeMove(st, x, y, t)
{
    const h = st.hist, prev = h[h.length - 1];
    if (!st.armed)
    {
        // how fast it is going now, over the last 50 ms or so, and whether it has turned back on its last flick
        let ref = prev;
        for (let k = h.length; k--;) { ref = h[k]; if (t - h[k][2] >= 50) break; }
        const slow = hypot(x - ref[0], y - ref[1])/max(1, t - ref[2]) < .12;
        const turned = (x - prev[0])*st.fx + (y - prev[1])*st.fy < 0;
        if (slow || turned) { st.armed = true; h.length = 0; h.push(prev); }
    }
    h.push([x, y, t]);
    while (h.length > 2 && t - h[0][2] > SWIPE_MS) h.shift();
    if (!st.armed) return;
    const o = h[0], dx = x - o[0], dy = y - o[1], d = hypot(dx, dy);
    if (d < SWIPE_PX || t - o[2] > SWIPE_MS) return;
    st.armed = false; st.fx = dx/d; st.fy = dy/d;
    return {x0: o[0], y0: o[1], dx, dy};
}

// a flip already going carries on under the finger
function flickHold(id)
{

    if (id === secondP && secondT < .12) secondT = 0;
}
addEventListener('pointermove', e=>
{
    const st = ptStart.get(e.pointerId);

    const id = e.pointerId, x = e.clientX, y = e.clientY;
    // coming up to a block of lines, each flick up or down steps one line, in the air as well as on the ground
    const atFork = forkAhead && !ride;
    const f = strokeMove(st, x, y, e.timeStamp);
    if (!f) return;
    swipeDone.add(id);
    if (atFork && abs(f.dy) > abs(f.dx)*1.1)
    {

        chooseLine(f.dy < 0 ? 1 : -1, id);

    }

{

        if (m.sub) txt(m.sub, W/2, my + i*step + 26*sc, fitSize(m.sub, 15*sc, wide, 700), '#fff', 'center', 700);
        ctx.globalAlpha = 1;
    });

    // first runs: show the controls as they are needed
    if (state == 'ride' && (tutorial < 3 || !everSwiped && swipeTutorial < 3))
    {
        let hint = '';
        if (!everJumped && hintT > 1.5) hint = 'TAP TO JUMP';
        else if (!everFlipped && !grounded && !grinding && airT > .2) hint = 'HOLD TO BACKFLIP';
        else if (!everSwiped && hintT > 20 && !grounded && !grinding && airT > .2) hint = 'SWIPE IN THE AIR FOR TRICKS';
        else if (everFlipped && hintT < 60 && !grounded && !grinding && airT > .2) hint = 'SECOND FINGER: HOLD TO FRONT FLIP';

        txt('TAP FOR YOUR SCORE CARD', W/2, bottom - (W > H ? 30 : 44), fitSize('TAP FOR YOUR SCORE CARD', 22, W - 30), 'rgba(255,255,255,' + clamp01((crashT - .6)*4)*(.65 + .35*sin(time*5)) + ')', 'center', 900);
    if (state == 'results' && resultsT > .4) drawResults(W, H);
    ctx.restore();
}

// the tricks in this air so far and the one under way, scored when the wheels touch
function drawAirTricks(W, y, sc, wide)
{
    if (grounded || grinding) return;
    const parts = [], n = abs(rot) > TAU*.7 ? max(1, round(abs(rot)/TAU)) : 0;
    if (n) parts.push((n > 1 ? n + 'x ' : '') + (rot > 0 ? 'BACKFLIP' : 'FRONTFLIP'));
    for (const t of stylesDone) parts.push(t.name);
    if (style) parts.push(style.name + '...');

    const s = parts.join('  +  ');
    txt(s, W/2, y, fitSize(s, 18*sc, wide), '#9dffb0', 'center', 900);

// each swipe leaves a short fading streak with an arrow head, so the player sees it was taken
function drawSwipes()
{
    while (swipeFx.length && time - swipeFx[0].t > .4) swipeFx.shift();
    ctx.lineCap = 'round';
    for (const f of swipeFx)
    {
        const a = 1 - (time - f.t)/.4, d = atan2(f.y1 - f.y0, f.x1 - f.x0);
        ctx.strokeStyle = f.line ? (f.y1 < f.y0 ? 'rgba(255,214,70,' : 'rgba(90,230,215,') + .9*a + ')' : 'rgba(160,255,190,' + .8*a + ')';
        ctx.lineWidth = 3 + 5*a;
        ctx.beginPath(); ctx.moveTo(f.x0, f.y0); ctx.lineTo(f.x1, f.y1);
        for (const s of [-1, 1]) { ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x1 - cos(d + s*.5)*16, f.y1 - sin(d + s*.5)*16); }
        ctx.stroke();
    }
}

// a sprocket for the count: a toothed ring
function drawGear(x, y, r, color)
{
    ctx.beginPath();
    for (let i = 0; i < 24; ++i)
    {
        const a = (i + .5)/24*TAU, rad = i % 4 < 2 ? r : r*.74;
        ctx.lineTo(x + cos(a)*rad, y + sin(a)*rad);

    ctx.closePath();

function drawBolt(x, y, s, color)
{
    ctx.beginPath();
    ctx.moveTo(x + s*.25, y - s); ctx.lineTo(x - s*.55, y + s*.12); ctx.lineTo(x - s*.02, y + s*.12);
    ctx.lineTo(x - s*.25, y + s); ctx.lineTo(x + s*.55, y - s*.12); ctx.lineTo(x + s*.02, y - s*.12);
    ctx.closePath();
    ctx.fillStyle = color; ctx.fill();

function drawSpeedLines(W, H, amount)

// a cow's moo, made from scratch: a buzzing voice through a mouth that opens from mmm to ooo and closes again,
// its pitch rising, holding with a wobble and sliding away at the end
// (pitch, length and loudness change it: low, short and quiet is a groan)
function moo(pitch=1, d=1.7, loud=.5)
{
    if (!soundOn || !audioContext || audioContext.state != 'running' || !audioMasterGain) return false;
    const ac = audioContext, t = ac.currentTime + .02, u = d/1.7;
    const voice = (type, k, level)=>
    {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = type; k *= pitch;
        o.frequency.setValueAtTime(95*k, t);
        o.frequency.linearRampToValueAtTime(146*k, t + .32*u);
        o.frequency.linearRampToValueAtTime(134*k, t + 1.1*u);
        o.frequency.exponentialRampToValueAtTime(72*k, t + d);
        const lfo = ac.createOscillator(), lg = ac.createGain();
        lfo.frequency.value = 5.2; lg.gain.value = 3*k;
        lfo.connect(lg); lg.connect(o.frequency);
        g.gain.value = level;
        o.connect(g);
        o.start(t); lfo.start(t); o.stop(t + d + .1); lfo.stop(t + d + .1);
        return g;
    };
    const mouth = ac.createBiquadFilter(), throat = ac.createBiquadFilter(), env = ac.createGain();
    mouth.type = 'lowpass'; mouth.Q.value = 5;
    mouth.frequency.setValueAtTime(240, t);
    mouth.frequency.linearRampToValueAtTime(950, t + .45*u);
    mouth.frequency.linearRampToValueAtTime(720, t + 1.15*u);
    mouth.frequency.linearRampToValueAtTime(260, t + d);
    throat.type = 'peaking'; throat.frequency.value = 620; throat.Q.value = 1.8; throat.gain.value = 9;
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(loud, t + .14*u);
    env.gain.setValueAtTime(loud, t + 1.2*u);
    env.gain.linearRampToValueAtTime(0, t + d);
    voice('sawtooth', 1, .7).connect(mouth);
    voice('square', .5, .35).connect(mouth);
    mouth.connect(throat); throat.connect(env); env.connect(audioMasterGain);
    return true;
}

function sfx(name, v=0)
{
    const s = SFX[name];
    if (!s || !soundOn) return;
    if (name == 'orb') s.play(undefined, .7, 1 + v*.035);
    else if (name == 'cell') s.play(undefined, .8, 1 + v*.05);
    else if (name == 'land') s.play(undefined, .45 + v*.6);
    else if (name == 'whoosh') s.play(undefined, 1, .85 + v*.07);
    else s.play();
}
function toggleSound()
{
    soundOn = !soundOn;
    setSoundVolume(soundOn ? .5 : 0);
}
function audioUnlock()
{
    if (audioContext && audioContext.state != 'running') audioContext.resume?.().catch?.(()=> {});
}

function audioInit()
{
    if (au || !audioContext || !audioMasterGain) return;
    try
    {
        const ac = audioContext, sr = ac.sampleRate;
        const buffer = (seconds, fill)=>
        {
            const b = ac.createBuffer(1, seconds*sr | 0, sr);
            fill(b.getChannelData(0));
            return b;
        };
        const white = buffer(2, d=> { for (let i = 0; i < d.length; ++i) d[i] = Math.random()*2 - 1; });
        const brown = buffer(2, d=>
        {
            let l = 0;
            for (let i = 0; i < d.length; ++i) { l = (l + .02*(Math.random()*2 - 1))/1.02; d[i] = l*3.5; }
        });
        const loop = (b, type, freq, q)=>
        {
            const src = ac.createBufferSource(), filter = ac.createBiquadFilter(), gain = ac.createGain();
            src.buffer = b; src.loop = true;
            filter.type = type; filter.frequency.value = freq; filter.Q.value = q;
            gain.gain.value = 0;
            src.connect(filter); filter.connect(gain); gain.connect(audioMasterGain);
            src.start();
            return {src, filter, gain};
        };
        au = {
            roll: loop(brown, 'lowpass', 300, .8),
            grit: loop(white, 'bandpass', 900, 1.2),
            wind: loop(white, 'bandpass', 700, .45),
            grind: loop(white, 'bandpass', 2400, 4)};
        // the eBike motor: a buzzing whine that climbs with the speed
        const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
        o.type = 'sawtooth'; o.frequency.value = 150;
        f.type = 'lowpass'; f.frequency.value = 1200; f.Q.value = 4;
        g.gain.value = 0;
        o.connect(f); f.connect(g); g.connect(audioMasterGain); o.start();
        au.motor = {o, f, g};
        musicInit(ac);
    }
    catch(e) { au = undefined; }
}

function audioUpdate()
{
    if (!au)
    {
        if (audioContext?.state == 'running') audioInit();
        return;
    }
    const now = audioContext.currentTime, set = (param, v, tc=.07)=> param.setTargetAtTime(v, now, tc);
    const riding = state == 'ride', speed = riding ? hypot(vx, vy) : 0, onGround = riding && (grounded || !!grinding?.deck);
    const snow = surfNow == S_SNOW;
    const deck = riding && !!grinding?.deck, skid = riding && braking && grounded;
    set(au.roll.gain.gain, onGround ? clamp01(speed/12)*(deck ? 1 : snow ? .4 : .75) : 0);
    set(au.roll.filter.frequency, deck ? 90 + speed*12 : 120 + speed*24);
    set(au.grit.gain.gain, skid ? .34 : onGround ? clamp01(speed/14)*(deck ? .06 : snow ? .28 : .16) : 0);
    set(au.grit.filter.frequency, skid ? 1500 + speed*30 : snow ? 2200 + speed*40 : 700 + speed*50);
    set(au.wind.gain.gain, riding ? clamp01((speed - 4)/24)**2*.55 + (grounded ? 0 : .06) + (boostT > 0 ? .1 : 0) : 0);
    set(au.wind.filter.frequency, 450 + speed*40);
    set(au.grind.gain.gain, riding && grinding && !grinding.deck ? .3 + .08*sin(now*40) : 0, .03);
    set(au.motor.g.gain, riding && turboT > 0 ? .085 : 0, .05);
    set(au.motor.o.frequency, 110 + speed*11);
    set(au.motor.f.frequency, 900 + speed*60);
    musicUpdate(now);
}

// ---------- the score: soft chords with a slow swell and a few plucked notes, through a gentle echo
let mus;
const CHORDS = [[45, 57, 60, 64, 67], [41, 53, 57, 60, 64], [36, 48, 55, 59, 64], [43, 55, 59, 62, 66],
    [38, 50, 57, 60, 65], [41, 53, 57, 60, 67], [36, 48, 52, 55, 62], [43, 55, 59, 62, 67]];
const midiHz = m=> 440*2**((m - 69)/12);
function musicInit(ac)
{
    const out = ac.createGain(), lp = ac.createBiquadFilter(), delay = ac.createDelay(1), fb = ac.createGain(), wet = ac.createGain();
    out.gain.value = .0;
    lp.type = 'lowpass'; lp.frequency.value = 1600; lp.Q.value = .3;
    delay.delayTime.value = .46; fb.gain.value = .38; wet.gain.value = .35;
    lp.connect(out); out.connect(audioMasterGain);
    out.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(audioMasterGain);
    mus = {ac, out, lp, next: ac.currentTime + .3, chord: 0, pluckNext: ac.currentTime + 2};
    out.gain.setTargetAtTime(.16, ac.currentTime, 3);
}
function musicNote(freq, start, len, vol, type='triangle', attack=1.6)
{
    const {ac, lp} = mus, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    o.detune.value = (Math.random() - .5)*10;
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(vol, start + attack);
    g.gain.setTargetAtTime(0, start + len, len*.35);
    o.connect(g); g.connect(lp);
    o.start(start); o.stop(start + len*2.5 + 1);
}
function musicUpdate(now)
{
    if (!mus) return;
    // a new chord every 6.4 seconds, the low note under four soft voices
    if (now > mus.next - .2)
    {
        const c = CHORDS[mus.chord++ % CHORDS.length], t = mus.next;
        musicNote(midiHz(c[0] - 12), t, 6, .1, 'sine', 2);
        for (let i = 1; i < c.length; ++i) musicNote(midiHz(c[i]), t + i*.05, 6, .035, 'triangle', 2.2);
        mus.next += 6.4;
    }
    // now and then a plucked note from the chord, an octave up
    if (now > mus.pluckNext)
    {
        const c = CHORDS[(mus.chord + CHORDS.length - 1) % CHORDS.length];
        if (Math.random() < .6) musicNote(midiHz(c[1 + (Math.random()*4 | 0)] + 12), mus.pluckNext, .5, .035, 'sine', .01);
        mus.pluckNext += [.8, 1.6, 2.4][Math.random()*3 | 0];
    }
    // the music sits back while riding hard, louder on the summit and after a crash
    mus.lp.frequency.setTargetAtTime(night > .5 ? 900 : 1600, now, 2);
}

// a test rider: jumps rocks and onto high rails, and flips on long flights when asked
function autopilotInput()
{
    if (grounded || grinding)
    {
        mainHeld = false;
        const lead = sp*.5 + .6;
        // rocks lie on the main trail only
        if (!onBranch(px)) for (const r of rocks) if (!r.jumped && r.x > px && r.x - px < lead && r.x - px > 1.5) { jumpQueued = true; r.jumped = true; }
        if (!onBranch(px)) for (const r of rails) if (!r.mount && r.x0 > px && r.x0 - px < sp*.25 + 1) jumpQueued = true;
        // half the time it pops off the lip of a drop-in
        const di = feats.find(f=> f.type == 'dropin' && px > f.x1 - 2.5 && px < f.x1 && onLine(f, px));
        if (di && !di.ap) { di.ap = true; if (Math.random() < .5) jumpQueued = true; }
        // picks a line at each fork, and fires the turbo when it can
        if (forkAhead && !ride && !forkAhead.picked)
        {
            forkAhead.picked = true;
            const p = window.__lanePilot || 'rand', ls = offeredLanes(forkAhead);
            // 'none' leaves the choice to whatever else is pressing
            if (p != 'none') laneWant = p == 'pro' ? (forkAhead.lines[2] ? 2 : ls[0]) : p == 'high' ? (forkAhead.lines[1] ? 1 : 0) : p == 'up' ? ls[0] :
                p == 'down' ? ls[ls.length - 1] : p == 'main' ? 0 : ls[Math.random()*ls.length | 0];
        }
        if (window.__turboPilot && battery >= 1) fireTurbo();
        return;
    }
    if (!window.__flipPilot && !window.__trickPilot) return;
    // will this flight last long enough for a flip? look ahead along the arc
    if (airT < .05)
    {
        let x = px, y = py, wy = vy, t = 0;
        let wx = vx;
        while (t < 3 && (y > rideY(x) || t < .05)) { t += 1/60; if (wx > VMAX + 3) wx += (VMAX + 3 - wx)*damp(4, 1/60); x += wx/60; wy -= G_AIR/60; y += wy/60; }
        const clear = !rails.some(r=> x > r.x0 - 2 && x < r.x1 + 2);
        window.__flipWanted = window.__flipPilot && t > .95 && clear;
        window.__flipFront = window.__flipPilot == 'front';
        window.__flightT = clear ? t : 0;
    }
    // a swipe trick when the rest of the flight has room for it
    if (window.__trickPilot && !style && !trickQueued && airT > .1 && window.__flightT)
    {
        let x = px, y = py, wx = vx, wy = vy, t = 0;
        while (t < 3 && y > rideY(x)) { t += 1/60; if (wx > VMAX + 3) wx += (VMAX + 3 - wx)*damp(4, 1/60); x += wx/60; wy -= G_AIR/60; y += wy/60; }
        const dir = Math.random()*8 | 0;
        if (t > TRICKS[SWIPE_TRICKS[dir]].dur + .2) airSwipe(dir);
    }
    if (!window.__flipPilot) return;
    const want = window.__flipWanted && abs(rot) < TAU*.8;
    if (window.__flipFront) { secondHeld = want; secondT = want ? 1 : 0; mainHeld = false; }
    else { mainHeld = want; mainT = want ? 1 : 0; }
}

    // try out a colour scheme: the rider's and bike's colours by name
    palette: o=> Object.assign(PAL, o),
    kit: i=> setKit(i), bike: i=> setBike(i), garage: ()=> menu = 'garage',
    brake: on=> { brakeHeld = on; }, tyresTo: n=> { brakeFuel = n >= 3 ? BRAKE_LEN : 0; },
    endRun: ()=> endRun(),
    // the middle of rider and bike as drawn, for close-ups
    riderAt: ()=> wrecked() ? vec3(rag.x - OX, rag.y - OY, rag.z) : bikeMatrix().transformPoint(vec3(0, 1, 0)),
    // how well the rider is in view: how far off the middle of the screen (1 = at its edge) and how much of the
    // body the ground hides from the camera
    view: ()=>
    {
        const c = render3D.camera, M = bikeMatrix(), aspect = mainCanvasSize.x/max(1, mainCanvasSize.y), vf = c.fov ?? .78;
        const look = vec3(camX - OX, camY - OY, wz(camX, camZ)), fw = look.subtract(c.pos).normalize();
        const rt = fw.cross(vec3(0, 1, 0)).normalize(), up = rt.cross(fw);
        let off = 0, hid = 0, ov = 0, oh = 0;
        const pts = [vec3(0, .37, .62), vec3(0, .37, -.64), vec3(0, 1.2, 0), vec3(0, 1.78, -.21)].map(p=> M.transformPoint(p));
        for (const p of pts)
        {
            const d = p.subtract(c.pos), z = d.dot(fw);
            const v = z <= 0 ? 9 : d.dot(up)/z/tan(vf/2), hz = z <= 0 ? 9 : d.dot(rt)/z/(tan(vf/2)*aspect);
            if (abs(v) > abs(ov)) ov = v;
            if (abs(hz) > abs(oh)) oh = hz;
            off = max(off, abs(v), abs(hz));
            for (let k = 1; k < 40; ++k)
            {
                const u = k/40, q = c.pos.add(d.scale(u));
                if (terrainAt(q.x + OX, q.z) > q.y + OY) { ++hid; break; }

        return {off: +off.toFixed(2), ov: +ov.toFixed(2), oh: +oh.toFixed(2), hid, px, ride: ride ? ride.lane : 0, what: ride?.what, grounded, airT};
    },
    wreck: ()=> ({rag: {...rag}, crashT, crashCam, pts: ragdoll?.pts.map(p=> ({x: p.x, y: p.y, z: p.z, vx: p.vx, vy: p.vy, g: terrainAt(p.x, p.z)})), pieces: pieces.map(p=> ({key: p.key, x: p.x, y: p.y, z: p.z, g: terrainAt(p.x, p.z)}))}),
    ground: x=> rideY(x), state: ()=> ({px, py, vx, vy, airT, grounded, run: state}),
    teleport: x=> { trackEnsure(x + TRACK_AHEAD); placeRider(x); state = 'ride'; sp = 16; },
    setDay: t=> dayT = t,
    feats: ()=> feats.map(f=> ({type: f.type, x0: f.x0, x1: f.x1, x2: f.x2, carved: f.carved, apexes: f.apexes?.length, line: f.line?.kind, mega: f.mega})),
    newRun: s=> newRun(s),
    camTune: (view, o)=> Object.assign(CAM_VIEWS[view], o),
    cam: (view, zoom=1)=> { camView.p = camView.l = view; camView.zp = camView.zl = zoom; },
    feats2: ()=> feats.map(f=> ({type: f.type, x0: f.x0, x1: f.x1})).concat(arches.map(a=> ({type: 'arch', x0: a.x, x1: a.x}))),
    lanes: (p, t)=> { window.__lanePilot = p; window.__turboPilot = t; },
    charge: v=> { battery = v; },
    turbo: ()=> fireTurbo(),
    zones: (n=5)=> ({seq: zoneSeq.slice(0, n), at: zoneB.slice(0, n).map(round), MT}),
};

engineInit(gameInit, gameUpdate, gameUpdatePost, undefined, gameRenderPost);
})();

</script>
